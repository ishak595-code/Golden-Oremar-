name: Verify Safety Panel

on:
  push:
    branches:
      - agent/product-safety-detail
    paths:
      - .github/workflows/verify-safety-panel.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply exact product detail patch
        run: node migration-tools/connect-product-safety-detail.mjs
      - name: Validate safety boundaries
        run: |
          grep -q "get_public_product_safety_v1" src/features/catalog/api.ts
          grep -q "ProductSafetyPanel" src/features/catalog/ProductDetailScreen.tsx
          grep -q "ProductSafetyPanel" src/features/catalog/ProductSafetyPanel.tsx
          ! grep -q "claimPolicy" src/features/catalog/ProductSafetyPanel.tsx
          ! grep -q "verificationNeeded" src/features/catalog/ProductSafetyPanel.tsx
      - name: Production build
        run: npm run build
      - name: Native sync
        run: npx cap sync android && npx cap sync ios
      - name: Compile Android debug app
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified product detail mount
        run: |
          git config user.name "Golden Oremar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/features/catalog/ProductDetailScreen.tsx
          git diff --cached --quiet || git commit -m "Mount structured product safety on product detail"
          git push origin HEAD:agent/product-safety-detail
