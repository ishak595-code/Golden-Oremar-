name: Verify Mobile Sheet Accessibility

on:
  push:
    branches: [agent/mobile-sheet-accessibility]
    paths:
      - '.github/workflows/verify-mobile-sheet-accessibility.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bind temporary patch sections to React state markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('migration-tools/harden-mobile-sheets-a11y-v3.mjs')
          text=path.read_text()
          replacements={
            "'      {/* Filter Bottom Sheet / Drawer */}'":"'{isFilterPanelOpen && ('",
            "'      {/* Sort Bottom Sheet / Drawer */}'":"'{isSortPanelOpen && ('",
            "'      {/* Toast */}'":"'{toast.visible && ('",
            "'      {/* Real Gift Order Flow */}'":"'function App()'",
          }
          for old,new in replacements.items():
              if text.count(old)!=1:
                  raise SystemExit(f'section boundary marker changed: {old}')
              text=text.replace(old,new,1)
          path.write_text(text)
          PY
      - name: Apply section-scoped sheet accessibility patch
        run: node migration-tools/harden-mobile-sheets-a11y-v3.mjs
      - name: Type-check accessibility hook
        run: npx tsc --noEmit --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --jsx react-jsx --types vite/client src/features/accessibility/useAccessibleDialog.ts
      - name: Parse App TypeScript
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import ts from 'typescript';
          const file='src/App.tsx';const source=fs.readFileSync(file,'utf8');
          const out=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX},reportDiagnostics:true,fileName:file});
          const errors=(out.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
          if(errors.length){console.error(errors.map(e=>ts.flattenDiagnosticMessageText(e.messageText,'\n')).join('\n'));process.exit(1);}
          console.log('App parses cleanly');
          NODE
      - name: Validate dialog/accessibility contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'role="dialog" aria-modal="true"' src/App.tsx)" -eq 3
          grep -q 'aria-labelledby="voice-search-title"' src/App.tsx
          grep -q 'aria-labelledby="filter-sheet-title"' src/App.tsx
          grep -q 'aria-labelledby="sort-sheet-title"' src/App.tsx
          grep -q 'aria-label="Sesli aramayı kapat"' src/App.tsx
          grep -q 'aria-label="Filtreleri kapat"' src/App.tsx
          grep -q 'aria-label="Sıralamayı kapat"' src/App.tsx
          grep -q 'aria-live="polite" aria-atomic="true"' src/App.tsx
          grep -q 'role="alert"' src/App.tsx
          grep -q 'aria-pressed={activeFilter === cat.name}' src/App.tsx
          grep -q 'aria-pressed={activeOrigin === originKey}' src/App.tsx
          grep -q 'aria-pressed={priceRange === range.value}' src/App.tsx
          grep -q 'aria-pressed={sortOption === opt.value}' src/App.tsx
          grep -q "{ label: 'En Yüksek Puan', value: 'rating' }" src/App.tsx
          ! grep -q 'En Popüler / En Çok Oy Alanlar' src/App.tsx
          grep -q '@media (prefers-reduced-motion: reduce)' src/index.css
          grep -q 'previouslyFocused.*focus' src/features/accessibility/useAccessibleDialog.ts
          grep -q "event.key === 'Escape'" src/features/accessibility/useAccessibleDialog.ts
          grep -q "event.key !== 'Tab'" src/features/accessibility/useAccessibleDialog.ts
      - name: Production web build
        run: npm run build
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified accessibility hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-mobile-sheet-accessibility.yml
          rm -f migration-tools/harden-mobile-sheets-a11y.mjs
          rm -f migration-tools/harden-mobile-sheets-a11y-v3.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Harden mobile bottom-sheet accessibility'
          git push origin HEAD:agent/mobile-sheet-accessibility
