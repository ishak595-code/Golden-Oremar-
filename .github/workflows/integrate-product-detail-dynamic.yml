name: Integrate Dynamic Product Detail

on:
  push:
    branches: [agent/product-detail-dynamic-complete]
    paths:
      - '.github/workflows/integrate-product-detail-dynamic.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Synchronize favorite state
        run: node migration-tools/integration/apply-product-detail-favorite-sync.mjs src/App.tsx
      - name: Verify product detail integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "favoriteReferences={favorites}" src/App.tsx
          grep -q "onFavoriteChanged=" src/App.tsx
          grep -q "Teslimat / Yurtdışı Hazırlığı" src/features/catalog/ProductDetailScreen.tsx
          grep -q "Kodu kopyala" src/features/catalog/ProductDetailScreen.tsx
          grep -q "availableQuantity" src/features/catalog/ProductDetailScreen.tsx
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/integrate-product-detail-dynamic.yml
          rm -f migration-tools/integration/apply-product-detail-favorite-sync.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Integrate dynamic product detail'
          git push origin HEAD:agent/product-detail-dynamic-complete
