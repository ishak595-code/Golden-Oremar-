name: Apply Premium Personalization

on:
  push:
    branches: [agent/premium-themes-notification-sounds]
    paths:
      - '.github/workflows/apply-premium-personalization.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply premium personalization wiring
        run: node migration-tools/patch-premium-personalization-wiring.mjs
      - name: Validate premium theme contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "export type PremiumPalette = 'emerald' | 'ruby' | 'obsidian' | 'pearl' | 'sapphire'" src/features/appearance/theme.ts
          for palette in emerald ruby obsidian pearl sapphire; do grep -q "data-palette=\"$palette\"" src/index.css; done
          grep -q "resolveInitialPalette()" src/main.tsx
          grep -q "palette: appearancePalette" src/App.tsx
          grep -q "onPaletteChange={setAppearancePalette}" src/App.tsx
          grep -q "PremiumPersonalizationPanel" src/features/account/SettingsPanel.tsx
          grep -q 'Şifre Değiştir' src/features/account/SettingsPanel.tsx
          grep -q 'E-bülten' src/features/account/SettingsPanel.tsx
          grep -q 'Oturum ve Güvenlik' src/features/account/SettingsPanel.tsx
      - name: Validate premium sound contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "DEFAULT_NOTIFICATION_SOUND: NotificationSoundId = 'rain-drop'" src/features/notifications/notificationSound.ts
          grep -q "name: 'Yağmur Damlası'" src/features/notifications/notificationSound.ts
          grep -q "name: 'Dağ Horozu'" src/features/notifications/notificationSound.ts
          grep -q "name: 'Kuş Korosu'" src/features/notifications/notificationSound.ts
          grep -q "name: 'Dere & Rüzgâr'" src/features/notifications/notificationSound.ts
          grep -q "name: 'Yayla Çanı'" src/features/notifications/notificationSound.ts
          grep -q 'notificationsHydrated' src/App.tsx
          grep -q 'if (previous === null)' src/App.tsx
          grep -q 'if (unreadCount > previous) void previewNotificationSound();' src/App.tsx
          grep -q 'notificationSound={notificationSound}' src/App.tsx
          grep -q 'onPreviewNotificationSound={previewNotificationSound}' src/App.tsx
      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files=[
            'src/features/appearance/theme.ts',
            'src/features/appearance/useDeviceTheme.ts',
            'src/features/notifications/notificationSound.ts',
            'src/features/notifications/useNotificationSound.ts',
            'src/features/account/useUnreadNotificationCount.ts',
            'src/features/account/PremiumPersonalizationPanel.tsx',
            'src/features/account/SettingsPanel.tsx',
            'src/features/account/AccountCenter.tsx',
            'src/main.tsx',
            'src/App.tsx',
          ];
          let failed=false;
          for(const file of files){const result=ts.transpileModule(fs.readFileSync(file,'utf8'),{fileName:file,reportDiagnostics:true,compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX}});const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);if(errors.length){failed=true;for(const d of errors)console.error(file,ts.flattenDiagnosticMessageText(d.messageText,'\n'));}else console.log(`${file}: parse clean`);}
          if(failed)process.exit(1);
          NODE
      - name: Production web build
        run: npm run build
      - name: Clean temporary integration files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-premium-personalization.yml
          rm -f migration-tools/patch-premium-personalization-wiring.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Integrate premium themes and notification sounds'
          git push origin HEAD:agent/premium-themes-notification-sounds
