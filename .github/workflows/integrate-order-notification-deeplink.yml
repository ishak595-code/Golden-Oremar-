name: Integrate Order Notification Deep Link

on:
  push:
    branches: [agent/order-notification-deeplink]
    paths:
      - '.github/workflows/integrate-order-notification-deeplink.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Patch order notification deep-link
        run: node migration-tools/integration/apply-order-notification-deeplink.mjs src/features/account/AccountCenter.tsx src/App.tsx
      - name: Verify deep-link integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "initialOrderId" src/features/account/OrdersPanel.tsx
          grep -q "requestedView.startsWith('orders:')" src/features/account/AccountCenter.tsx
          grep -q "initialOrderId={orderDetailId||null}" src/features/account/AccountCenter.tsx
          grep -q 'orders:${metadata.orderId}' src/App.tsx
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/integrate-order-notification-deeplink.yml
          rm -f migration-tools/integration/apply-order-notification-deeplink.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Integrate order notification deep-link'
          git push origin HEAD:agent/order-notification-deeplink
