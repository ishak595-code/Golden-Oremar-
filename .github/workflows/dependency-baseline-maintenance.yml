name: Dependency Baseline Maintenance

on:
  push:
    branches:
      - maintenance/dependency-baseline-2026-08

permissions:
  contents: write

concurrency:
  group: dependency-baseline-maintenance
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/dependency-baseline-2026-08
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lock metadata from declared dependency classes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh Browserslist compatibility database
        run: npx --yes update-browserslist-db@latest
      - name: Install exact refreshed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Require zero production dependency advisories
        run: npm audit --omit=dev --audit-level=low
      - name: Reject high or critical development-tool advisories
        run: npm audit --audit-level=high
      - name: Verify TypeScript and production build
        run: npx tsc --noEmit && npm run build
      - name: Harden permanent production vulnerability gate and commit generated files
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/mobile-quality.yml'
          old='npm audit --omit=dev --audit-level=high'
          new='npm audit --omit=dev --audit-level=low'
          matches="$(grep -Fxc "        run: $old" "$target")"
          if [[ "$matches" -ne 1 ]]; then
            echo "Expected exactly one production audit gate, found $matches." >&2
            exit 1
          fi
          sed -i "s/npm audit --omit=dev --audit-level=high/npm audit --omit=dev --audit-level=low/" "$target"
          grep -Fq "run: $new" "$target"
          git diff --check
          if ! git diff --quiet -- package.json; then
            echo 'Refusing uncommitted package.json mutation.' >&2
            git diff -- package.json >&2
            exit 1
          fi
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(package-lock\.json|\.github/workflows/mobile-quality\.yml)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Refusing unexpected generated files:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json "$target"
          if git diff --cached --quiet; then
            echo 'Dependency baseline and production audit gate are already current.'
            exit 0
          fi
          git commit -m 'Enforce zero production dependency advisories [dependency-baseline]'
          git push origin HEAD:maintenance/dependency-baseline-2026-08
