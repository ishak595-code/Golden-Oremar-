name: Dependency Baseline Maintenance

on:
  push:
    branches:
      - maintenance/dependency-baseline-2026-08

permissions:
  contents: write

concurrency:
  group: dependency-baseline-maintenance
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: maintenance/dependency-baseline-2026-08
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Regenerate lock metadata from declared dependency classes
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh Browserslist compatibility database
        run: npx --yes update-browserslist-db@latest
      - name: Install exact refreshed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Require zero production dependency advisories
        run: npm audit --omit=dev --audit-level=low
      - name: Reject high or critical development-tool advisories
        run: npm audit --audit-level=high
      - name: Verify TypeScript and production build
        run: npx tsc --noEmit && npm run build
      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if git diff --quiet -- package-lock.json; then
            echo 'package-lock.json is already current.'
            exit 0
          fi
          if ! git diff --quiet -- package.json; then
            echo 'Refusing uncommitted package.json mutation.' >&2
            git diff -- package.json >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh dependency security baseline [dependency-baseline]'
          git push origin HEAD:maintenance/dependency-baseline-2026-08
