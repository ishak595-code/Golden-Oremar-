name: Verify Premium Settings

on:
  push:
    branches:
      - agent/premium-settings-themes-sounds

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/premium-settings-themes-sounds
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Integrate premium settings safely
        run: node .github/scripts/apply-premium-settings.mjs

      - name: Validate premium contracts
        run: |
          grep -q "Zümrüt Oremar" src/features/appearance/theme.ts
          grep -q "Yakut Prestige" src/features/appearance/theme.ts
          grep -q "Obsidyen Gece" src/features/appearance/theme.ts
          grep -q "İnci Beyazı" src/features/appearance/theme.ts
          grep -q "Şampanya Altın" src/features/appearance/theme.ts
          grep -q "Oremar Damlası" src/features/notifications/premiumSounds.ts
          grep -q "Dağ Kuşları" src/features/notifications/premiumSounds.ts
          grep -q "Şafak Horozu" src/features/notifications/premiumSounds.ts
          grep -q "Keklik Çağrısı" src/features/notifications/premiumSounds.ts
          grep -q "Yayla Çanı" src/features/notifications/premiumSounds.ts
          grep -q "PremiumPreferencesPanel" src/features/account/SettingsPanel.tsx
          grep -q "playNotificationSound" src/features/account/useUnreadNotificationCount.ts
          ! grep -q "frequency.setValueAtTime(880" src/context/DataContext.tsx

      - name: Parse changed TypeScript modules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files = [
            'src/features/appearance/theme.ts',
            'src/features/appearance/useDeviceTheme.ts',
            'src/features/notifications/premiumSounds.ts',
            'src/features/account/PremiumPreferencesPanel.tsx',
            'src/features/account/SettingsPanel.tsx',
            'src/features/account/AccountCenter.tsx',
            'src/features/account/useUnreadNotificationCount.ts',
            'src/context/DataContext.tsx',
            'src/native.ts',
          ];
          let failed = false;
          for (const file of files) {
            const result = ts.transpileModule(fs.readFileSync(file, 'utf8'), {
              compilerOptions: { jsx: ts.JsxEmit.ReactJSX, target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext },
              reportDiagnostics: true,
              fileName: file,
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              failed = true;
              console.error(file, errors.map(d => ts.flattenDiagnosticMessageText(d.messageText, '\n')));
            }
          }
          if (failed) process.exit(1);
          NODE

      - name: Production web build
        run: npm run build

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit verified premium settings
        run: |
          rm -f .github/scripts/apply-premium-settings.mjs .github/workflows/verify-premium-settings.yml
          git config user.name "Golden Oremar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 0
          fi
          git commit -m "Complete premium themes and notification signatures [skip ci]"
          git push origin HEAD:agent/premium-settings-themes-sounds
