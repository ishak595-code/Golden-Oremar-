name: Consolidation Preflight

on:
  push:
    branches:
      - integration/full-consolidation-2026-08
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidation-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://rmfcziawxjgcnxexbrvw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n4P4WYheJjOzgjO90Ko_jA_vh3CS8Vg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Run every contract and security audit
        run: npm run audit:all
      - name: TypeScript zero-error gate
        run: npx tsc --noEmit
      - name: Production build and bundle budget
        run: npm run build
