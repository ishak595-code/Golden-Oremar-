name: Consolidation Preflight

on:
  push:
    branches:
      - integration/full-consolidation-2026-08
      - release/store-readiness-2026-08
      - release/ux-professionalization-2026-08
      - release/product-story-ordering-2026-09
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: consolidation-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-consolidation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_SUPABASE_URL: https://rmfcziawxjgcnxexbrvw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n4P4WYheJjOzgjO90Ko_jA_vh3CS8Vg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=low
      - name: Run every contract and security audit
        run: npm run audit:all
      - name: TypeScript zero-error gate
        run: npx tsc --noEmit
      - name: Production build and bundle budget
        run: npm run build

  publish-status:
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: verify-consolidation
    runs-on: ubuntu-latest
    steps:
      - name: Publish preflight commit status
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.verify-consolidation.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${RESULT}" == "success" ]]; then
            state=success
            description='All audits, TypeScript, dependency and build gates passed'
          else
            state=failure
            description="Preflight job ${RESULT}"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" \
            -f context='consolidation/preflight' \
            -f description="${description}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
