name: Complete Source Handoff

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-source-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify clean tracked source state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -f PROJECT_HANDOFF.md
          test -f PROJECT_STATE.json
          test -f package.json
          test -f package-lock.json
          test -d src
          test -d android
          test -d ios
          test -d supabase
          test -d scripts
          test -d .github/workflows

      - name: Build reproducible source archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          archive="handoff/Golden-Oremar-complete-source-${GITHUB_SHA}.zip"
          git archive --format=zip --output="$archive" HEAD
          git ls-files | LC_ALL=C sort > handoff/TRACKED_FILES.txt
          sha256sum "$archive" > handoff/SHA256SUMS.txt
          printf '%s\n' \
            "Golden Oremar complete source handoff" \
            "commit=${GITHUB_SHA}" \
            "branch=${GITHUB_REF_NAME}" \
            "workflow_run=${GITHUB_RUN_ID}" \
            "archive=$(basename "$archive")" \
            "tracked_files=$(wc -l < handoff/TRACKED_FILES.txt)" \
            > handoff/PACKAGE_INFO.txt
          unzip -t "$archive" >/dev/null

      - name: Upload complete source handoff
        uses: actions/upload-artifact@v7
        with:
          name: golden-oremar-complete-source-${{ github.sha }}
          path: handoff/
          if-no-files-found: error
          retention-days: 30
