name: Bootstrap Golden Oremar Canonical Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-loader.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golden-oremar-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack cumulative Golden Oremar payload
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/golden-oremar-payload.b64
          for i in $(seq 0 24); do
            idx=$(printf '%03d' "$i")
            case "$idx" in
              016)
                cat .bootstrap/fix-016-a.b64 .bootstrap/fix-016-b1.b64 .bootstrap/fix-016-b2.b64 >> /tmp/golden-oremar-payload.b64
                ;;
              021)
                cat .bootstrap/fix-021-a.b64 .bootstrap/fix-021-b.b64 >> /tmp/golden-oremar-payload.b64
                ;;
              *)
                cat ".bootstrap/chunk-${idx}.b64" >> /tmp/golden-oremar-payload.b64
                ;;
            esac
          done
          echo 'ec28598f5860926de267158f3d6d6172ad04e01c219ae33db3d4714d003dccbb  /tmp/golden-oremar-payload.b64' | sha256sum -c -
          base64 -d /tmp/golden-oremar-payload.b64 > /tmp/golden-oremar-payload.tar.gz
          echo 'f87903547ec921e88a2a4947a830a7720e3c29c49c482d4bdfdd62b7f7cf0841  /tmp/golden-oremar-payload.tar.gz' | sha256sum -c -
          tar -xzf /tmp/golden-oremar-payload.tar.gz -C .

      - name: Import only missing legacy application shell
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/ishak595-code/bilgideposu.git /tmp/golden-oremar-legacy
          rsync -a --ignore-existing \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'dist' \
            --exclude 'node_modules' \
            --exclude 'android/app/src/main/assets/public' \
            --exclude 'ios/App/App/public' \
            /tmp/golden-oremar-legacy/ ./

      - name: Set canonical package and mobile identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const additions = JSON.parse(fs.readFileSync('migration-tools/package-additions.json', 'utf8'));
          pkg.name = 'golden-oremar';
          pkg.dependencies = { ...(pkg.dependencies || {}), ...(additions.dependencies || {}) };
          pkg.scripts = { ...(pkg.scripts || {}), 'android:init': 'npx cap init "Golden Oremar" com.goldenoremar.app --web-dir dist' };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          if (fs.existsSync('capacitor.config.ts')) {
            let cap = fs.readFileSync('capacitor.config.ts', 'utf8');
            cap = cap.replace(/appId:\s*['"][^'"]+['"]/, `appId: 'com.goldenoremar.app'`);
            cap = cap.replace(/appName:\s*['"][^'"]+['"]/, `appName: 'Golden Oremar'`);
            fs.writeFileSync('capacitor.config.ts', cap);
          }
          NODE

      - name: Apply cumulative Supabase frontend integration
        run: node migration-tools/integration/apply-all-current.mjs src/App.tsx src/context/DataContext.tsx

      - name: Remove generated legacy web bundles
        shell: bash
        run: |
          rm -rf android/app/src/main/assets/public ios/App/App/public dist
          mkdir -p android/app/src/main/assets
          printf '%s\n' '# Generated by Capacitor sync; source lives in src/.' > android/app/src/main/assets/.golden-oremar-source-note

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Commit canonical integrated source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .bootstrap-trigger
          rm -f .github/workflows/bootstrap-loader.yml .github/workflows/bootstrap-golden-oremar.yml
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No bootstrap changes to commit.'
            exit 0
          fi
          git commit -m 'Import cumulative Golden Oremar application'
          git push origin HEAD:main
