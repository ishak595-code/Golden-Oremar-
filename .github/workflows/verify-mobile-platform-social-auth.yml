name: Verify Mobile Platform Social Auth

on:
  push:
    branches: [agent/mobile-platform-social-auth]
    paths:
      - '.github/workflows/verify-mobile-platform-social-auth.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install and refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor dependency line
        shell: bash
        run: |
          set -euo pipefail
          npm ls @capacitor/core @capacitor/android @capacitor/ios @capacitor/cli @capacitor/browser @capacitor/app @capacitor/keyboard @capacitor/splash-screen @capacitor/status-bar
          node - <<'NODE'
          const p = require('./package-lock.json');
          const root = p.packages[''];
          if (!root.dependencies['@capacitor/browser']) throw new Error('Browser plugin missing from lockfile root');
          NODE

      - name: Validate social auth source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "provider: SocialAuthProvider" src/features/auth/api.ts
          grep -q "skipBrowserRedirect: native" src/features/auth/api.ts
          grep -q "Browser.open" src/features/auth/api.ts
          grep -q "Browser.close" src/features/auth/api.ts
          grep -q "VITE_GOOGLE_AUTH_ENABLED=false" .env.example
          grep -q "VITE_FACEBOOK_AUTH_ENABLED=false" .env.example
          grep -q "Google ile devam et" src/features/auth/AuthScreen.tsx
          grep -q "Facebook ile devam et" src/features/auth/AuthScreen.tsx
          grep -q "minSdkVersion = 24" android/variables.gradle
          grep -q "compileSdkVersion = 36" android/variables.gradle
          grep -q "targetSdkVersion = 36" android/variables.gradle
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 15.0" ios/App/App.xcodeproj/project.pbxproj

      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          const files = ['src/features/auth/api.ts','src/features/auth/AuthScreen.tsx','src/features/auth/useAuthRecoveryCoordinator.ts'];
          for (const file of files) {
            const text = fs.readFileSync(file,'utf8');
            const sf = ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,file.endsWith('.tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
            if (sf.parseDiagnostics.length) {
              console.error(file, sf.parseDiagnostics.map(d => d.messageText));
              process.exitCode = 1;
            }
          }
          NODE

      - name: Production web build
        run: npm run build

      - name: Synchronize native projects
        run: |
          npx cap sync android
          npx cap sync ios
          grep -R "capacitor-browser" android/capacitor.settings.gradle ios/App/CapApp-SPM/Package.swift

      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit verified dependency lock and native sync
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-mobile-platform-social-auth.yml
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Complete mobile platform and provider-gated social auth foundation'
          git push origin HEAD:agent/mobile-platform-social-auth
