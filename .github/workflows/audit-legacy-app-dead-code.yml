name: Audit Legacy App Dead Code

on:
  push:
    branches: [agent/legacy-dead-code-cleanup]
    paths:
      - '.github/workflows/audit-legacy-app-dead-code.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Audit App dead code
        run: node migration-tools/audit-app-dead-code.mjs src/App.tsx
