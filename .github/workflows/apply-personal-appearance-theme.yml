name: Apply Personal Appearance Theme

on:
  push:
    branches: [agent/personal-appearance-theme]
    paths:
      - '.github/workflows/apply-personal-appearance-theme.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply exact App appearance integration
        run: node migration-tools/patch-personal-theme-app.mjs
      - name: Validate personal appearance contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "useDeviceTheme" src/App.tsx
          grep -q "theme={appearanceTheme}" src/App.tsx
          grep -q "onThemeChange={setAppearanceTheme}" src/App.tsx
          grep -q "golden-oremar:appearance-theme:v1" src/features/appearance/theme.ts
          grep -q "resolveInitialTheme" src/main.tsx
          grep -q "initNativeFeatures(initialTheme)" src/main.tsx
          grep -q -- "--bg-main: #F4F7F5" src/index.css
          grep -q -- "--text-main: #14261C" src/index.css
          grep -q -- "--brand-gold: #8A6810" src/index.css
          grep -q ':root\[data-theme="dark"\]' src/index.css
          ! grep -q "settings.theme" src/App.tsx
          ! grep -q "updateSettings({ theme" src/App.tsx
          ! grep -q "syncNativeAppearance(settings.theme" src/App.tsx
      - name: Validate key light-theme contrast ratios
        run: |
          node --input-type=module <<'NODE'
          function rgb(hex){const v=hex.replace('#','');return [0,2,4].map(i=>parseInt(v.slice(i,i+2),16)/255)}
          function lum(hex){return rgb(hex).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4).reduce((sum,c,i)=>sum+c*[.2126,.7152,.0722][i],0)}
          function ratio(a,b){const [hi,lo]=[lum(a),lum(b)].sort((x,y)=>y-x);return (hi+.05)/(lo+.05)}
          const checks=[
            ['main text on card','#14261C','#FFFFFF',7],
            ['green on card','#145A32','#FFFFFF',4.5],
            ['gold on card','#8A6810','#FFFFFF',4.5],
            ['muted on card','#4B6156','#FFFFFF',4.5],
          ];
          for(const [name,fg,bg,min] of checks){const r=ratio(fg,bg);console.log(`${name}: ${r.toFixed(2)}:1`);if(r<min)process.exitCode=1}
          NODE
      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files = [
            'src/App.tsx',
            'src/main.tsx',
            'src/native.ts',
            'src/features/appearance/theme.ts',
            'src/features/appearance/useDeviceTheme.ts',
          ];
          let failed=false;
          for(const file of files){
            const result=ts.transpileModule(fs.readFileSync(file,'utf8'),{
              fileName:file,reportDiagnostics:true,
              compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX},
            });
            const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){failed=true;for(const d of errors)console.error(file,ts.flattenDiagnosticMessageText(d.messageText,'\n'));}
            else console.log(`${file}: parse clean`);
          }
          if(failed)process.exit(1);
          NODE
      - name: Production web build
        run: npm run build
      - name: Commit verified appearance source and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-personal-appearance-theme.yml
          rm -f migration-tools/patch-personal-theme-app.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Make appearance personal and accessible'
          git push origin HEAD:agent/personal-appearance-theme
