name: Fix Shipped App Types Once

on:
  push:
    branches:
      - agent/admin-supabase-retire-node

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[app-types-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-supabase-retire-node
          fetch-depth: 0

      - name: Apply focused source typing fixes
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'src/App.tsx': [
              ("HERO_CATEGORIES.find(c => c.targetCategory === activeFilter)?.title", "heroCategories.find((c: any) => c.targetCategory === activeFilter)?.title"),
            ],
            'src/features/account/AddressesPanel.tsx': [
              ("{field.label}{field.required ? ' *' : ''}", "{field.label}{'required' in field && field.required ? ' *' : ''}"),
              ("required={field.required}", "required={'required' in field ? field.required : false}"),
            ],
            'src/features/account/ReturnRequestDialog.tsx': [
              ("const selectedItems=useMemo(()=>Object.entries(itemState).filter(([,v])=>v.selected),[itemState]);", "const selectedItems=useMemo(()=>(Object.entries(itemState) as Array<[string,ItemState]>).filter(([,v])=>v.selected),[itemState]);"),
              ("const totalFiles=useMemo(()=>Object.values(itemState).reduce((sum,v)=>sum+v.files.length,0),[itemState]);", "const totalFiles=useMemo(()=>(Object.values(itemState) as ItemState[]).reduce((sum,v)=>sum+v.files.length,0),[itemState]);"),
            ],
            'src/features/catalog/useLiveHomeCatalog.ts': [
              ("const producerIds = [...new Set(catalogItems.map((item: any) => String(item?.producer?.id || '')).filter(Boolean))];", "const producerIds: string[] = Array.from(new Set<string>(catalogItems.map((item: any) => String(item?.producer?.id || '')).filter((value: string) => Boolean(value))));"),
            ],
          }

          for filename, items in replacements.items():
            path = Path(filename)
            text = path.read_text()
            for old, new in items:
              if old not in text:
                raise SystemExit(f'{filename}: expected patch target not found: {old[:90]}')
              text = text.replace(old, new, 1)
            path.write_text(text)

          Path('.github/workflows/fix-app-types-once.yml').unlink()

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golden-oremar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix shipped app TypeScript defects [app-types-fixed]"
          git push origin HEAD:agent/admin-supabase-retire-node
