name: Apply Home Storefront Finalization

on:
  push:
    branches: [agent/home-storefront-dynamic-premium-finalization]
    paths:
      - '.github/workflows/apply-home-storefront-finalization.yml'
      - 'migration-tools/patch-home-dynamic-premium.mjs'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply exact home storefront patch
        run: node migration-tools/patch-home-dynamic-premium.mjs
      - name: Validate dynamic and truthful storefront contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const quickCategories = (categoriesWithProducts.length ? categoriesWithProducts : liveCategories).slice(0, 4);" src/App.tsx
          grep -q "const spotlightProduct = products.find" src/App.tsx
          grep -q "producerFollowerCount: producerMetric ? producerMetric.followerCount : null" src/features/catalog/useLiveHomeCatalog.ts
          grep -q "producerVerified: producerMetric?.verified === true" src/features/catalog/useLiveHomeCatalog.ts
          grep -q "producerOriginVerified: producerMetric?.originVerified === true" src/features/catalog/useLiveHomeCatalog.ts
          grep -q "En Yüksek Puan" src/App.tsx
          ! grep -q "Fahrettin'in Sütten Kesilmiş Oğlağı" src/App.tsx
          ! grep -q "\['bal-sifa', 'sut-sarkuteri', 'et-balik', 'meyve-sebze'\]" src/App.tsx
          ! grep -q "producerMetric?.verified ?? true" src/features/catalog/useLiveHomeCatalog.ts
      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files = ['src/App.tsx', 'src/features/catalog/useLiveHomeCatalog.ts'];
          let failed = false;
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const result = ts.transpileModule(source, {
              fileName: file,
              reportDiagnostics: true,
              compilerOptions: { target: ts.ScriptTarget.ES2022, module: ts.ModuleKind.ESNext, jsx: ts.JsxEmit.ReactJSX },
            });
            const errors = (result.diagnostics || []).filter(d => d.category === ts.DiagnosticCategory.Error);
            if (errors.length) {
              failed = true;
              for (const diagnostic of errors) console.error(file, ts.flattenDiagnosticMessageText(diagnostic.messageText, '\n'));
            } else console.log(`${file}: parse clean`);
          }
          if (failed) process.exit(1);
          NODE
      - name: Production web build
        run: npm run build
      - name: Commit verified source and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-home-storefront-finalization.yml
          rm -f migration-tools/patch-home-dynamic-premium.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Finalize dynamic premium home storefront'
          git push origin HEAD:agent/home-storefront-dynamic-premium-finalization
