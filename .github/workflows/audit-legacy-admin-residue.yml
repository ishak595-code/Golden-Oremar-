name: Audit Legacy Admin Residue

on:
  push:
    branches:
      - agent/admin-supabase-retire-node
    paths:
      - 'src/admin/**'
      - 'src/pages/AdminPage.tsx'
      - 'src/**/firebase*'
      - 'src/**/DataContext*'

permissions:
  contents: read

concurrency:
  group: admin-residue-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Audit legacy admin component references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Legacy component references ==='
          for symbol in AdminInterface AdminMarketing AdminVendorProfile VendorFinance LegacyAdminEntry DataProvider; do
            echo "--- ${symbol} ---"
            git grep -n "${symbol}" -- 'src/**' || true
          done

          echo '=== DataContext / Firebase residue under src ==='
          git grep -nE "useData\(|DataContext|DataProvider|firebase/|from ['\"]\.\.?/.*firebase['\"]|from ['\"]\.\.?/firebase['\"]" -- 'src/**' || true

          echo '=== Admin files importing DataContext or Firebase ==='
          git grep -nE "useData\(|DataContext|DataProvider|firebase/|from ['\"]\.\.?/.*firebase['\"]|from ['\"]\.\.?/firebase['\"]" -- 'src/admin/**' || true

          echo '=== firebase.ts references ==='
          git grep -nE "from ['\"][^'\"]*firebase['\"]|from ['\"][^'\"]*firebase\.ts['\"]" -- 'src/**' || true

          echo '=== Local API residue ==='
          git grep -nE "['\"]\/api\/|fetch\([^\n]*\/api\/|axios[^\n]*\/api\/" -- 'src/**' || true
