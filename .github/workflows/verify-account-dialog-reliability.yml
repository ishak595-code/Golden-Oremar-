name: Verify Account Dialog Reliability

on:
  push:
    branches: [agent/account-destructive-dialog-reliability]
    paths:
      - '.github/workflows/verify-account-dialog-reliability.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate dialog/destructive contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "useAccessibleDialog<HTMLDivElement>" src/features/account/useDialogA11y.ts
          ! grep -q "document.addEventListener('keydown'" src/features/account/useDialogA11y.ts
          grep -q 'role="alertdialog"' src/features/account/ProfilePanel.tsx
          grep -q 'confirmRemoveAvatar' src/features/account/ProfilePanel.tsx
          ! grep -q 'onClick={removeAvatar}' src/features/account/ProfilePanel.tsx
          grep -q 'role="alertdialog"' src/features/account/OrdersPanel.tsx
          grep -q 'nestedOpen=Boolean(returnOrderId||returnDetailId||cancelCandidate)' src/features/account/OrdersPanel.tsx
          grep -q 'Boolean(detail)&&!nestedOpen' src/features/account/OrdersPanel.tsx
          ! grep -q 'onClick={()=>void cancel(detail.id)}' src/features/account/OrdersPanel.tsx
          grep -q 'return-loading-title' src/features/account/ReturnRequestDialog.tsx
          grep -q 'loadingDialogRef' src/features/account/ReturnRequestDialog.tsx
          grep -q 'return-detail-loading-title' src/features/account/ReturnDetailDialog.tsx
          grep -q 'loadingDialogRef' src/features/account/ReturnDetailDialog.tsx
      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files=[
            'src/features/account/useDialogA11y.ts',
            'src/features/account/ProfilePanel.tsx',
            'src/features/account/OrdersPanel.tsx',
            'src/features/account/ReturnRequestDialog.tsx',
            'src/features/account/ReturnDetailDialog.tsx',
          ];
          let failed=false;
          for(const file of files){const result=ts.transpileModule(fs.readFileSync(file,'utf8'),{fileName:file,reportDiagnostics:true,compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX}});const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);if(errors.length){failed=true;for(const d of errors)console.error(file,ts.flattenDiagnosticMessageText(d.messageText,'\n'));}else console.log(`${file}: parse clean`);}
          if(failed)process.exit(1);
          NODE
      - name: Production web build
        run: npm run build
      - name: Clean verifier from source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-account-dialog-reliability.yml
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Verify account destructive dialog package'
          git push origin HEAD:agent/account-destructive-dialog-reliability
