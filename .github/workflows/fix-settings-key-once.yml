name: Fix Settings Key Once

on:
  push:
    branches:
      - agent/admin-supabase-retire-node

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[settings-key-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-supabase-retire-node
          fetch-depth: 0
      - name: Fix Field key typing and remove workflow
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/admin/AdminSettings.tsx')
          text = path.read_text()
          old = "function Field({label,children}:{label:string;children:React.ReactElement})"
          new = "function Field({label,children}:{label:string;children:React.ReactElement;key?:React.Key})"
          if old not in text:
              raise SystemExit('Field signature target not found')
          path.write_text(text.replace(old,new,1))
          Path('.github/workflows/fix-settings-key-once.yml').unlink()
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golden-oremar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix settings field key typing [settings-key-fixed]"
          git push origin HEAD:agent/admin-supabase-retire-node
