name: Audit Customer Copy Truth

on:
  push:
    branches: [agent/customer-copy-truth]
    paths:
      - '.github/workflows/audit-customer-copy-truth.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find customer shell claim-like copy
        shell: bash
        run: |
          set -euo pipefail
          echo '--- App claim-like strings ---'
          grep -n -i -E 'şifa|organik|doğal|vip|mucize|tedavi|sağlık' src/App.tsx || true
          echo '--- Static shell branding strings ---'
          grep -n -i -E 'şifa|organik|vip|mucize|tedavi' index.html vite.config.ts || true
