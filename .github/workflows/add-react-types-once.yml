name: Add React Types Once

on:
  push:
    branches:
      - agent/admin-supabase-retire-node

permissions:
  contents: write

jobs:
  align:
    if: ${{ !contains(github.event.head_commit.message, '[react-types-aligned]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-supabase-retire-node
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install React 19 type packages
        run: npm install --save-dev @types/react@^19.0.0 @types/react-dom@^19.0.0 --no-audit --no-fund
      - name: Remove one-shot workflow
        run: rm .github/workflows/add-react-types-once.yml
      - name: Commit dependency alignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golden-oremar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Align React 19 TypeScript definitions [react-types-aligned]"
          git push origin HEAD:agent/admin-supabase-retire-node
