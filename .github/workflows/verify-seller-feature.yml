name: Verify Seller Feature Gate

on:
  push:
    branches: [agent/seller-traceability-finance]
    paths:
      - '.github/workflows/verify-seller-feature.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Verify SellerPanel integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ProducerTraceabilityPanel" src/features/account/SellerPanel.tsx
          grep -q "ProducerFinancePanel" src/features/account/SellerPanel.tsx
          grep -q "Lot & İzlenebilirlik yönetimini aç" src/features/account/SellerPanel.tsx
          grep -q "Finans detaylarını aç" src/features/account/SellerPanel.tsx
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Record verified feature state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .verification
          printf '%s\n' 'seller-traceability-finance: verified' > .verification/seller-traceability-finance.txt
          rm -f .github/workflows/verify-seller-feature.yml
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Verify seller traceability and finance'
          git push origin HEAD:agent/seller-traceability-finance
