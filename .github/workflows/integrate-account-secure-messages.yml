name: Integrate Account Secure Messages

on:
  push:
    branches: [agent/account-secure-messages-integration]
    paths:
      - '.github/workflows/integrate-account-secure-messages.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Patch account message integration
        run: node migration-tools/integration/apply-account-secure-messages.mjs src/features/account/AccountCenter.tsx src/App.tsx
      - name: Verify secure message integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "MessagesPanel" src/features/account/AccountCenter.tsx
          grep -q "Mesajlarım" src/features/account/AccountCenter.tsx
          grep -q "messages:${conversationId}" src/App.tsx || grep -q "messages:\${conversationId}" src/App.tsx
          grep -q "message-attachments" src/features/account/messagesApi.ts
          grep -q "send_conversation_message_v1" src/features/account/messagesApi.ts
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/integrate-account-secure-messages.yml
          rm -f migration-tools/integration/apply-account-secure-messages.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Integrate secure account messages'
          git push origin HEAD:agent/account-secure-messages-integration
