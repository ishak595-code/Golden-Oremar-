name: Regenerate Mobile Brand Assets Once

on:
  push:
    branches:
      - agent/admin-supabase-retire-node

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[mobile-assets-regenerated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-supabase-retire-node
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install deterministic image tooling
        run: python -m pip install --disable-pip-version-check pillow==11.3.0 cairosvg==2.8.2

      - name: Regenerate Android, iOS and PWA brand assets from source SVG
        shell: python
        run: |
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFilter
          import cairosvg

          root = Path('.')
          svg = (root / 'public/logo.svg').read_bytes()

          def render_logo(size: int) -> Image.Image:
              png = cairosvg.svg2png(bytestring=svg, output_width=size, output_height=size)
              return Image.open(BytesIO(png)).convert('RGBA')

          def premium_background(size: int) -> Image.Image:
              top = (4, 65, 39)
              bottom = (20, 126, 73)
              img = Image.new('RGB', (size, size), top)
              px = img.load()
              for y in range(size):
                  t = y / max(1, size - 1)
                  r = round(top[0] * (1 - t) + bottom[0] * t)
                  g = round(top[1] * (1 - t) + bottom[1] * t)
                  b = round(top[2] * (1 - t) + bottom[2] * t)
                  for x in range(size):
                      px[x, y] = (r, g, b)
              return img

          def master_icon(size: int = 1024, safe_ratio: float = 0.64) -> Image.Image:
              bg = premium_background(size)
              draw = ImageDraw.Draw(bg)
              inset = max(4, round(size * 0.035))
              draw.rounded_rectangle(
                  (inset, inset, size - inset, size - inset),
                  radius=round(size * 0.16),
                  outline=(226, 181, 80),
                  width=max(3, round(size * 0.014)),
              )
              halo = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              hdraw = ImageDraw.Draw(halo)
              hdraw.ellipse(
                  (round(size * .20), round(size * .18), round(size * .80), round(size * .78)),
                  fill=(255, 255, 255, 34),
              )
              halo = halo.filter(ImageFilter.GaussianBlur(radius=max(2, size // 28)))
              bg = Image.alpha_composite(bg.convert('RGBA'), halo)
              logo_size = round(size * safe_ratio)
              logo = render_logo(logo_size)
              x = (size - logo_size) // 2
              y = round(size * 0.17)
              bg.alpha_composite(logo, (x, y))
              return bg.convert('RGB')

          def foreground(size: int) -> Image.Image:
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              logo_size = round(size * 0.62)
              logo = render_logo(logo_size)
              canvas.alpha_composite(logo, ((size - logo_size)//2, round(size * .18)))
              return canvas

          def splash(width: int, height: int) -> Image.Image:
              bg = premium_background(max(width, height)).resize((width, height), Image.Resampling.LANCZOS)
              canvas = bg.convert('RGBA')
              logo_size = round(min(width, height) * 0.36)
              logo = render_logo(logo_size)
              canvas.alpha_composite(logo, ((width - logo_size)//2, (height - logo_size)//2 - round(height * .02)))
              return canvas.convert('RGB')

          master = master_icon()

          android_sizes = {
              'mdpi': 48,
              'hdpi': 72,
              'xhdpi': 96,
              'xxhdpi': 144,
              'xxxhdpi': 192,
          }
          android_foreground_sizes = {
              'mdpi': 108,
              'hdpi': 162,
              'xhdpi': 216,
              'xxhdpi': 324,
              'xxxhdpi': 432,
          }
          for density, size in android_sizes.items():
              directory = root / f'android/app/src/main/res/mipmap-{density}'
              directory.mkdir(parents=True, exist_ok=True)
              icon = master.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(directory / 'ic_launcher.png', format='PNG', optimize=True)
              icon.save(directory / 'ic_launcher_round.png', format='PNG', optimize=True)
              foreground(android_foreground_sizes[density]).save(directory / 'ic_launcher_foreground.png', format='PNG', optimize=True)

          portrait = {
              'mdpi': (320, 480),
              'hdpi': (480, 800),
              'xhdpi': (720, 1280),
              'xxhdpi': (960, 1600),
              'xxxhdpi': (1280, 1920),
          }
          landscape = {density: (height, width) for density, (width, height) in portrait.items()}
          for density, dimensions in portrait.items():
              directory = root / f'android/app/src/main/res/drawable-port-{density}'
              directory.mkdir(parents=True, exist_ok=True)
              splash(*dimensions).save(directory / 'splash.png', format='PNG', optimize=True)
          for density, dimensions in landscape.items():
              directory = root / f'android/app/src/main/res/drawable-land-{density}'
              directory.mkdir(parents=True, exist_ok=True)
              splash(*dimensions).save(directory / 'splash.png', format='PNG', optimize=True)
          splash(480, 480).save(root / 'android/app/src/main/res/drawable/splash.png', format='PNG', optimize=True)

          ios_icon = master_icon(1024, .64)
          ios_icon.save(root / 'ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png', format='PNG', optimize=True)
          ios_splash = splash(2732, 2732)
          splash_dir = root / 'ios/App/App/Assets.xcassets/Splash.imageset'
          for filename in ['splash-2732x2732.png', 'splash-2732x2732-1.png', 'splash-2732x2732-2.png']:
              ios_splash.save(splash_dir / filename, format='PNG', optimize=True)

          master.resize((192, 192), Image.Resampling.LANCZOS).save(root / 'public/icon-192.png', format='PNG', optimize=True)
          master.resize((512, 512), Image.Resampling.LANCZOS).save(root / 'public/icon-512.png', format='PNG', optimize=True)
          master_icon(512, .54).save(root / 'public/icon-maskable-512.png', format='PNG', optimize=True)

          expected = [
              root / 'android/app/src/main/res/mipmap-mdpi/ic_launcher.png',
              root / 'android/app/src/main/res/drawable/splash.png',
              root / 'ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png',
              root / 'ios/App/App/Assets.xcassets/Splash.imageset/splash-2732x2732.png',
              root / 'public/icon-192.png',
              root / 'public/icon-512.png',
              root / 'public/icon-maskable-512.png',
          ]
          for path in expected:
              with Image.open(path) as image:
                  image.verify()
              if path.read_bytes()[:8] != b'\x89PNG\r\n\x1a\n':
                  raise SystemExit(f'Invalid PNG signature: {path}')

      - name: Restore native icon references and point PWA to raster icons
        shell: python
        run: |
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:icon="@drawable/ic_launcher_vector"', 'android:icon="@mipmap/ic_launcher"')
          text = text.replace('android:roundIcon="@drawable/ic_launcher_vector"', 'android:roundIcon="@mipmap/ic_launcher_round"')
          manifest.write_text(text)

          vite = Path('vite.config.ts')
          text = vite.read_text()
          text = text.replace("src: 'logo.svg',\n            sizes: '192x192',\n            type: 'image/svg+xml',", "src: 'icon-192.png',\n            sizes: '192x192',\n            type: 'image/png',")
          text = text.replace("src: 'logo.svg',\n            sizes: '512x512',\n            type: 'image/svg+xml',\n            purpose: 'any maskable',", "src: 'icon-512.png',\n            sizes: '512x512',\n            type: 'image/png',\n            purpose: 'any',\n          },\n          {\n            src: 'icon-maskable-512.png',\n            sizes: '512x512',\n            type: 'image/png',\n            purpose: 'maskable',")
          vite.write_text(text)

          Path('.github/workflows/regenerate-mobile-brand-assets-once.yml').unlink()

      - name: Commit regenerated brand assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golden-oremar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate premium mobile brand assets [mobile-assets-regenerated]"
          git push origin HEAD:agent/admin-supabase-retire-node
