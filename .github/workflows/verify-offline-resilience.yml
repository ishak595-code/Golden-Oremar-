name: Verify Offline Resilience

on:
  push:
    branches:
      - agent/offline-reconnect-resilience

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/offline-reconnect-resilience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded offline resilience patch
        run: node .github/scripts/apply-offline-resilience.mjs
      - name: Validate offline contracts
        run: |
          grep -q "useConnectivity" src/App.tsx
          grep -q "Çevrimdışısınız" src/App.tsx
          grep -q "restoreSequence" src/App.tsx
          grep -q "NETWORK_RESTORED_EVENT" src/features/catalog/useLiveHomeCatalog.ts
          grep -q "Network.getStatus" src/features/resilience/useConnectivity.ts
          ! grep -q "Network.addListener('networkStatusChange'" src/App.tsx
      - name: Parse changed TypeScript modules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files=['src/App.tsx','src/features/resilience/useConnectivity.ts','src/features/catalog/useLiveHomeCatalog.ts'];
          let failed=false;
          for(const file of files){const r=ts.transpileModule(fs.readFileSync(file,'utf8'),{compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},reportDiagnostics:true,fileName:file});const errors=(r.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);if(errors.length){failed=true;console.error(file,errors.map(d=>ts.flattenDiagnosticMessageText(d.messageText,'\n')));}}
          if(failed)process.exit(1);
          NODE
      - name: Production web build
        run: npm run build
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified offline resilience
        run: |
          rm -f .github/scripts/apply-offline-resilience.mjs .github/workflows/verify-offline-resilience.yml
          git config user.name "Golden Oremar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add truthful offline and reconnect resilience [skip ci]"
          git push origin HEAD:agent/offline-reconnect-resilience
