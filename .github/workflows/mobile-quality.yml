name: Mobile Quality Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-publication:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'release/catalog-publish-2026-08' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://rmfcziawxjgcnxexbrvw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n4P4WYheJjOzgjO90Ko_jA_vh3CS8Vg
      E2E_CI_CONTROL_URL: https://rmfcziawxjgcnxexbrvw.supabase.co/functions/v1/ci-e2e-user
      CATALOG_PUBLICATION_APPROVED: '1'
      OFFICIAL_NOTIFICATION_BOUNDARY: 'producer-owned-only'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Request short-lived GitHub OIDC token for approved publication
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]]; then separator='&'; fi
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=golden-oremar-ci-e2e")"
          token="$(node -e "const value=JSON.parse(process.argv[1]).value||'';if(!value)process.exit(2);process.stdout.write(value)" "$response")"
          echo "::add-mask::$token"
          echo "E2E_CI_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Publish exact approved 42-product official catalog atomically
        run: node scripts/publish-approved-catalog-once.mjs
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-oremar-catalog-publication-${{ github.sha }}
          path: e2e-artifacts/catalog-publication.json
          if-no-files-found: warn
          retention-days: 30
