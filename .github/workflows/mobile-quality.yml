name: Mobile Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/full-consolidation-2026-08
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  customer-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://rmfcziawxjgcnxexbrvw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n4P4WYheJjOzgjO90Ko_jA_vh3CS8Vg
      VITE_PUBLIC_APP_ORIGIN: http://127.0.0.1:4173
      E2E_BASE_URL: http://127.0.0.1:4173
      E2E_CI_CONTROL_URL: https://rmfcziawxjgcnxexbrvw.supabase.co/functions/v1/ci-e2e-user
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund

      - name: Install pinned Chromium E2E runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Build browser application against canonical Supabase
        run: npm run build

      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/golden-oremar-preview.log 2>&1 &
          echo $! >/tmp/golden-oremar-preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/golden-oremar-preview.log
          exit 1

      - name: Request short-lived GitHub OIDC token for E2E control
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]]; then separator='&'; fi
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=golden-oremar-ci-e2e")"
          token="$(node -e "const value=JSON.parse(process.argv[1]).value||'';if(!value)process.exit(2);process.stdout.write(value)" "$response")"
          echo "::add-mask::$token"
          echo "E2E_CI_OIDC_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run mandatory authenticated customer Chromium journey
        run: node scripts/customer-e2e.mjs

      - name: Upload customer E2E evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-oremar-customer-e2e-${{ github.sha }}
          path: e2e-artifacts/
          if-no-files-found: error
          retention-days: 14

  verify-web-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: https://rmfcziawxjgcnxexbrvw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n4P4WYheJjOzgjO90Ko_jA_vh3CS8Vg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android 17 API 37.0 with pinned official Android CLI
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_VERSION="15859902"
          TOOLS_SHA256="4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583"
          TOOLS_ZIP="${RUNNER_TEMP}/commandlinetools-linux-${TOOLS_VERSION}_latest.zip"
          TOOLS_DIR="${RUNNER_TEMP}/android-command-line-tools"
          curl --fail --location --retry 3 --silent --show-error \
            "https://dl.google.com/android/repository/commandlinetools-linux-${TOOLS_VERSION}_latest.zip" \
            --output "${TOOLS_ZIP}"
          echo "${TOOLS_SHA256}  ${TOOLS_ZIP}" | sha256sum --check --strict
          rm -rf "${TOOLS_DIR}"
          mkdir -p "${TOOLS_DIR}"
          unzip -q "${TOOLS_ZIP}" -d "${TOOLS_DIR}"
          ANDROID_CLI="${TOOLS_DIR}/cmdline-tools/bin/android"
          test -x "${ANDROID_CLI}"
          "${ANDROID_CLI}" --version
          "${ANDROID_CLI}" --sdk="${ANDROID_HOME}" sdk install \
            platform-tools \
            platforms/android-37.0 \
            build-tools/37.0.0 \
            --canary
          test -f "${ANDROID_HOME}/platforms/android-37.0/android.jar"
          test -x "${ANDROID_HOME}/build-tools/37.0.0/aapt2"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Release architecture audit
        run: npm run audit:release

      - name: Validate current native baseline and preserved OAuth
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pkg = require('./package.json');
          const expected = {
            '@capacitor/android':'8.5.0',
            '@capacitor/app':'8.1.1',
            '@capacitor/browser':'8.0.4',
            '@capacitor/core':'8.5.0',
            '@capacitor/haptics':'8.0.2',
            '@capacitor/ios':'8.5.0',
            '@capacitor/keyboard':'8.0.5',
            '@capacitor/network':'8.0.1',
            '@capacitor/splash-screen':'8.0.2',
            '@capacitor/status-bar':'8.0.3'
          };
          for (const [name, version] of Object.entries(expected)) {
            if (pkg.dependencies?.[name] !== version) throw new Error(`${name}: expected ${version}, got ${pkg.dependencies?.[name]}`);
          }
          if (pkg.dependencies?.firebase) throw new Error('Firebase must not return to the runtime dependency graph.');
          if (pkg.devDependencies?.['@capacitor/cli'] !== '8.5.0') throw new Error('@capacitor/cli must be 8.5.0');
          NODE
          grep -q "com.android.tools.build:gradle:9.3.0" android/build.gradle
          if grep -q 'kotlin-gradle-plugin' android/build.gradle; then
            echo 'Legacy Kotlin Gradle plugin must not be configured with AGP 9 built-in Kotlin.' >&2
            exit 1
          fi
          grep -q 'gradle-9.5.0-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'minSdkVersion = 24' android/variables.gradle
          grep -q 'compileSdkVersion = 37' android/variables.gradle
          grep -q 'compileSdkMinorVersion = 0' android/variables.gradle
          grep -q 'targetSdkVersion = 37' android/variables.gradle
          grep -q 'minorApiLevel = rootProject.ext.compileSdkMinorVersion' android/app/build.gradle
          grep -q 'JavaVersion.VERSION_21' android/app/build.gradle
          grep -q 'androidResources' android/app/build.gradle
          grep -q 'proguard-android-optimize.txt' android/app/build.gradle
          if grep -q "apply plugin: 'kotlin-android'" android/app/build.gradle || grep -q 'kotlinOptions' android/app/build.gradle || grep -q 'aaptOptions' android/app/build.gradle; then
            echo 'Legacy AGP/Kotlin/resource DSL must not return.' >&2
            exit 1
          fi
          grep -q 'density' android/app/src/main/AndroidManifest.xml
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'SceneDelegate.swift in Sources' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'SceneDelegateProxy.shared.scene' ios/App/App/SceneDelegate.swift
          grep -q 'UIApplicationSceneManifest' ios/App/App/Info.plist
          grep -q 'configurationForConnecting' ios/App/App/AppDelegate.swift
          grep -q 'VITE_GOOGLE_AUTH_ENABLED' .env.example
          grep -q 'VITE_FACEBOOK_AUTH_ENABLED' .env.example
          grep -q "from '@capacitor/browser'" src/features/auth/api.ts
          grep -q 'signInWithOAuth' src/features/auth/api.ts
          grep -q 'skipBrowserRedirect: native' src/features/auth/api.ts
          if git grep -nE "firebase/(app|auth|firestore|storage)|from ['\"][^'\"]*firebase['\"]" -- 'src/**'; then
            echo 'Firebase runtime source residue found.' >&2
            exit 1
          fi

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production web build
        run: npm run build

      - name: Upload deployable web build
        uses: actions/upload-artifact@v7
        with:
          name: golden-oremar-web-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Synchronize Android and iOS native projects
        run: npx cap sync android && npx cap sync ios

      - name: Ensure native sync is reproducible
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo 'Capacitor sync changed tracked native files. Commit generated native changes before merging.' >&2
            git diff --stat
            git diff
            exit 1
          fi

      - name: Verify consolidated features in Android native shell assets
        run: node scripts/native-feature-runtime-check.mjs android

      - name: Verify Gradle 9.5 wrapper
        working-directory: android
        run: chmod +x gradlew && ./gradlew --version | grep -q 'Gradle 9.5'

      - name: Compile Android debug app
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload installable Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: golden-oremar-android-debug-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compile Android release bundle without signing
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload unsigned Android release AAB
        uses: actions/upload-artifact@v7
        with:
          name: golden-oremar-android-unsigned-release-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  verify-ios:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      VITE_SUPABASE_URL: https://rmfcziawxjgcnxexbrvw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n4P4WYheJjOzgjO90Ko_jA_vh3CS8Vg
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Verify stable Apple toolchain and iOS SDK family
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.6"
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK ${IOS_SDK_VERSION}"
          [[ "${IOS_SDK_VERSION}" == 26.* ]]

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Release architecture audit
        run: npm run audit:release

      - name: Build and synchronize iOS
        run: npm run build && npx cap sync ios

      - name: Ensure iOS sync is reproducible
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo 'Capacitor iOS sync changed tracked files. Commit generated changes before merging.' >&2
            git diff --stat
            git diff
            exit 1
          fi

      - name: Verify consolidated features in iOS native shell assets
        run: node scripts/native-feature-runtime-check.mjs ios

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme App

      - name: Compile iOS simulator app
        run: >-
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Verify iOS deployment target and app identifier
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.goldenoremar.app;' ios/App/App.xcodeproj/project.pbxproj

  publish-mobile-statuses:
    if: ${{ always() }}
    needs:
      - customer-e2e
      - verify-web-android
      - verify-ios
    runs-on: ubuntu-latest
    steps:
      - name: Publish mobile quality commit statuses
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOMER_RESULT: ${{ needs.customer-e2e.result }}
          ANDROID_RESULT: ${{ needs.verify-web-android.result }}
          IOS_RESULT: ${{ needs.verify-ios.result }}
        shell: bash
        run: |
          set -euo pipefail
          publish() {
            local context="$1"
            local result="$2"
            local label="$3"
            local state=failure
            if [[ "${result}" == "success" ]]; then state=success; fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="${state}" \
              -f context="${context}" \
              -f description="${label}: ${result}" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          publish 'consolidation/customer-e2e' "${CUSTOMER_RESULT}" 'Authenticated Chromium'
          publish 'consolidation/android' "${ANDROID_RESULT}" 'Web and Android native'
          publish 'consolidation/ios' "${IOS_RESULT}" 'iOS simulator native'
