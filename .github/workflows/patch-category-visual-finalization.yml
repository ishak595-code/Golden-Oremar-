name: Apply Category Visual Finalization

on:
  push:
    branches: [agent/category-canonical-card-visual-finalization]
    paths:
      - '.github/workflows/patch-category-visual-finalization.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Patch App quantity bridge
        run: node migration-tools/patch-category-quantity.mjs
      - name: Validate focused source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "import CatalogProductCard from './CatalogProductCard'" src/features/catalog/CategoryDirectoryScreen.tsx
          grep -q "getProducerFollowMetrics" src/features/catalog/CategoryDirectoryScreen.tsx
          grep -q "producerVerified: metric?.verified === true" src/features/catalog/CategoryDirectoryScreen.tsx
          grep -q "onAddToCart={async (item, quantity)" src/App.tsx
          grep -q "}, quantity);" src/App.tsx
          ! grep -q "<ShoppingCart" src/features/catalog/CategoryDirectoryScreen.tsx
      - name: Parse changed TypeScript modules
        run: npx tsc --noEmit --pretty false
      - name: Production web build
        run: npm run build
      - name: Commit integration and clean temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/patch-category-visual-finalization.yml
          rm -f migration-tools/patch-category-quantity.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Finalize category catalog card consistency'
          git push origin HEAD:agent/category-canonical-card-visual-finalization
