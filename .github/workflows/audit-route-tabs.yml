name: Audit Route Tabs

on:
  push:
    branches: [agent/route-tab-hardening]
    paths:
      - '.github/workflows/audit-route-tabs.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit --no-fund
      - run: node migration-tools/audit-route-tabs.mjs src/App.tsx
