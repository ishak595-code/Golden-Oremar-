name: Resolve Product Safety Main Conflict

on:
  push:
    branches: [agent/structured-product-safety-content]
    paths:
      - '.github/workflows/resolve-product-safety-main-conflict.yml'

permissions:
  contents: write

jobs:
  resolve-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Merge latest main and preserve only intended conflict
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          MERGE_CODE=$?
          set -e
          if [ "$MERGE_CODE" -ne 0 ]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            printf 'Conflicts:\n%s\n' "${conflicts[*]:-none}"
            if [ "${#conflicts[@]}" -ne 1 ] || [ "${conflicts[0]}" != "src/features/catalog/ProductDetailScreen.tsx" ]; then
              echo 'Unexpected merge conflict set; refusing automatic resolution.'
              exit 1
            fi
            # During this merge, --theirs is the current origin/main ProductDetail,
            # which contains the newer accessible quantity +/- behavior.
            git checkout --theirs -- src/features/catalog/ProductDetailScreen.tsx
          fi

      - name: Reapply structured safety panel onto latest ProductDetail
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const file = 'src/features/catalog/ProductDetailScreen.tsx';
          let text = fs.readFileSync(file, 'utf8');
          function replaceExact(from, to, expected = 1) {
            const count = text.split(from).length - 1;
            if (count !== expected) throw new Error(`Expected ${expected} occurrences, found ${count}: ${from.slice(0, 130)}`);
            text = text.split(from).join(to);
          }
          if (!text.includes("ProductSafetyPanel from'../content/ProductSafetyPanel'")) {
            replaceExact(
              "import{getProductDetail,listProductReviews,publicCatalogUrl,toggleProductFavorite}from'./api';",
              "import{getProductDetail,listProductReviews,publicCatalogUrl,toggleProductFavorite}from'./api';import ProductSafetyPanel from'../content/ProductSafetyPanel';import{getProductSafety}from'../content/productSafetyApi';"
            );
          }
          if (!text.includes('const[safetyContent,setSafetyContent]=useState<any>(null);')) {
            replaceExact(
              "const[detail,setDetail]=useState<any>(null);const[reviews,setReviews]=useState<any>(null);",
              "const[detail,setDetail]=useState<any>(null);const[safetyContent,setSafetyContent]=useState<any>(null);const[reviews,setReviews]=useState<any>(null);"
            );
          }
          if (!text.includes("getProductSafety(reference,'tr')")) {
            replaceExact(
              "useEffect(()=>{void load();},[reference]);",
              "useEffect(()=>{void load();},[reference]);\n useEffect(()=>{let active=true;setSafetyContent(null);getProductSafety(reference,'tr').then(data=>{if(active)setSafetyContent(data);}).catch(error=>{console.warn('Structured product safety content unavailable.',error);if(active)setSafetyContent(null);});return()=>{active=false;};},[reference]);"
            );
          }
          if (!text.includes('safetyContent?.safety')) {
            replaceExact(
              '  <section className="mt-5 rounded-2xl border p-5"><h2 className="flex items-center gap-2 text-xl font-bold"><QrCode',
              '  <ProductSafetyPanel safety={safetyContent?.safety} summary={safetyContent?.summary} heading="Gıda güvenliği & kullanım" className="mt-5"/>\n  <section className="mt-5 rounded-2xl border p-5"><h2 className="flex items-center gap-2 text-xl font-bold"><QrCode'
            );
          }
          fs.writeFileSync(file, text);
          NODE
          git add src/features/catalog/ProductDetailScreen.tsx
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo 'Unresolved merge conflicts remain.'
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - name: Validate both quantity and safety contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "<Minus" src/features/catalog/ProductDetailScreen.tsx
          grep -q "<Plus" src/features/catalog/ProductDetailScreen.tsx
          grep -q "setCartItem({variantId:variant.id,quantity})" src/features/catalog/ProductDetailScreen.tsx
          grep -q "ProductSafetyPanel" src/features/catalog/ProductDetailScreen.tsx
          grep -q "getProductSafety(reference,'tr')" src/features/catalog/ProductDetailScreen.tsx
          grep -q "safetyContent?.safety" src/features/catalog/ProductDetailScreen.tsx
          grep -q "get_public_content_entry_v2" src/features/content/api.ts
          grep -q "get_public_product_safety_v1" src/features/content/productSafetyApi.ts
          test -f supabase/migrations/20260816160543_archive_and_harden_public_product_safety_v1.sql
          test -f supabase/migrations/20260816162315_classify_dried_persimmon_product_safety_v2.sql

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Parse affected TypeScript
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          const files = [
            'src/features/content/ProductSafetyPanel.tsx',
            'src/features/content/productSafetyApi.ts',
            'src/features/content/api.ts',
            'src/features/content/PublicHealthScreen.tsx',
            'src/features/catalog/ProductDetailScreen.tsx',
          ];
          let failed = false;
          for (const file of files) {
            const text = fs.readFileSync(file,'utf8');
            const sf = ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,file.endsWith('.tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
            if (sf.parseDiagnostics.length) {
              failed = true;
              console.error(file, sf.parseDiagnostics.map(d => d.messageText));
            }
          }
          if (failed) process.exit(1);
          NODE

      - name: Production web build
        run: npm run build

      - name: Synchronize native projects
        run: |
          npx cap sync android
          npx cap sync ios

      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit resolved and verified branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/resolve-product-safety-main-conflict.yml
          git add -A
          git status --short
          git commit -m 'Merge latest main into structured product safety content'
          git push origin HEAD:agent/structured-product-safety-content
