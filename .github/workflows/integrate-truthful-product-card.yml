name: Integrate Truthful Product Card

on:
  push:
    branches: [agent/product-card-truthful-dynamic]
    paths:
      - '.github/workflows/integrate-truthful-product-card.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Patch App product card integration
        run: node migration-tools/integration/apply-truthful-product-card.mjs src/App.tsx
      - name: Verify truthful card source
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CatalogProductCard" src/App.tsx
          ! grep -q "function ProductCard(" src/App.tsx
          ! grep -q "gallery1-" src/App.tsx
          ! grep -q 'badges.push({ text: "En Çok Satan"' src/App.tsx
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/integrate-truthful-product-card.yml
          rm -f migration-tools/integration/apply-truthful-product-card.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Integrate truthful dynamic product card'
          git push origin HEAD:agent/product-card-truthful-dynamic
