name: Verify Customer Copy Truth

on:
  push:
    branches: [agent/customer-copy-truth]
    paths:
      - '.github/workflows/verify-customer-copy-truth.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply customer shell copy cleanup
        run: node migration-tools/clean-customer-shell-copy.mjs
      - name: Validate copy contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Ürün, üretici veya köy ara...' src/App.tsx
          grep -q 'Aramak istediğiniz ürünün adını söyleyin...' src/App.tsx
          grep -q 'Kategori, köken ve fiyatla sonuçları daraltın.' src/App.tsx
          grep -q "sortOption === 'rating' ? 'En Yüksek Puan'" src/App.tsx
          grep -q '>Öne Çıkan Ürün<' src/App.tsx
          grep -q '>Katalog Seçkisi<' src/App.tsx
          grep -q '>Mevsim Seçkisi<' src/App.tsx
          ! grep -q 'Şifa dolusu doğal ürünler' src/App.tsx
          ! grep -q 'Şifa arayın:' src/App.tsx
          ! grep -q 'Organik Işkın' src/App.tsx
          ! grep -q 'Doğal ürünlerimizin adını fısıldayın' src/App.tsx
          ! grep -q 'Aradığınız şifayı' src/App.tsx
          ! grep -q 'taze şifalı otlar' src/App.tsx
          ! grep -q '>Günün Fırsatı<' src/App.tsx
          ! grep -q '>Bugünün Önerisi<' src/App.tsx
          ! grep -q '>Sınırlı Üretim<' src/App.tsx
      - name: Parse App TypeScript
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import ts from 'typescript';
          const file='src/App.tsx';const source=fs.readFileSync(file,'utf8');
          const out=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX},reportDiagnostics:true,fileName:file});
          const errors=(out.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
          if(errors.length){console.error(errors.map(e=>ts.flattenDiagnosticMessageText(e.messageText,'\n')).join('\n'));process.exit(1);}
          console.log('App parses cleanly');
          NODE
      - name: Production web build
        run: npm run build
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified copy cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/audit-customer-copy-truth.yml
          rm -f .github/workflows/verify-customer-copy-truth.yml
          rm -f migration-tools/clean-customer-shell-copy.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Replace unverified customer shell marketing claims'
          git push origin HEAD:agent/customer-copy-truth
