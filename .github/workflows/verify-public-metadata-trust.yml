name: Verify Public Metadata Trust

on:
  push:
    branches: [agent/public-metadata-trust]
    paths:
      - '.github/workflows/verify-public-metadata-trust.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply dynamic metadata patch
        run: node migration-tools/harden-public-metadata.mjs
      - name: Validate source metadata and client env boundary
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'loadEnv' vite.config.ts
          ! grep -q 'GEMINI_API_KEY' vite.config.ts
          ! grep -q 'process.env.GEMINI_API_KEY' vite.config.ts
          grep -q "name: 'Golden Oremar'" vite.config.ts
          grep -q "short_name: 'Oremar'" vite.config.ts
          grep -q "start_url: '/?tab=home'" vite.config.ts
          grep -q "lang: 'tr'" vite.config.ts
          ! grep -q 'user-scalable=no' index.html
          ! grep -q 'maximum-scale=1.0' index.html
          ! grep -q 'goldenoremar.com' index.html
          ! grep -q 'unsplash.com' index.html
          ! grep -q '+90-500-000-0000' index.html
          ! grep -q '%100' index.html
          ! grep -qi 'organik' index.html
          ! grep -qi 'şifa' index.html
          ! grep -qi 'glutensiz' index.html
          ! grep -qi 'vegan' index.html
          ! grep -q 'VIP Organik Ekosistem' src/App.tsx
          ! grep -q 'şifalı bitkiler' src/App.tsx
          grep -q "account: 'Hesabım | Golden Oremar'" src/App.tsx
          grep -q 'twitter:description' src/App.tsx
      - name: Parse changed TypeScript
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          for (const file of ['src/App.tsx','vite.config.ts']) {
            const source=fs.readFileSync(file,'utf8');
            const out=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX},reportDiagnostics:true,fileName:file});
            const errors=(out.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){console.error(file,errors.map(e=>ts.flattenDiagnosticMessageText(e.messageText,'\n')).join('\n'));process.exit(1);}
          }
          console.log('Metadata TypeScript parses cleanly');
          NODE
      - name: Production web build
        run: npm run build
      - name: Validate built PWA manifest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('dist/manifest.webmanifest','utf8'));
          const expected={name:'Golden Oremar',short_name:'Oremar',lang:'tr',start_url:'/?tab=home',scope:'/',display:'standalone'};
          for(const [key,value] of Object.entries(expected)){
            if(manifest[key]!==value)throw new Error(`manifest ${key}: expected ${value}, got ${manifest[key]}`);
          }
          if(!String(manifest.description||'').includes('Doğrulanmış üreticilerden'))throw new Error('Truthful PWA description missing');
          console.log('PWA manifest validated');
          NODE
          ! grep -q 'user-scalable=no' dist/index.html
          ! grep -q 'goldenoremar.com' dist/index.html
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified public metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-public-metadata-trust.yml
          rm -f migration-tools/harden-public-metadata.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Harden public metadata and PWA trust surface'
          git push origin HEAD:agent/public-metadata-trust
