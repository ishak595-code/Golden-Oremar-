name: Finalize Capacitor 8.5 Native Migration

on:
  push:
    branches: [agent/capacitor-8-stable-quality]
    paths:
      - '.github/workflows/finalize-capacitor-85-native.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Register SceneDelegate in Xcode project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('ios/App/App.xcodeproj/project.pbxproj')
          text = p.read_text()
          if 'SceneDelegate.swift in Sources' in text:
              print('SceneDelegate already registered')
          else:
              replacements = [
                  ('\t\t504EC3081FED79650016851F /* AppDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = 504EC3071FED79650016851F /* AppDelegate.swift */; };',
                   '\t\t504EC3081FED79650016851F /* AppDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = 504EC3071FED79650016851F /* AppDelegate.swift */; };\n\t\tA85CENE10000000000000001 /* SceneDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = A85CENE20000000000000002 /* SceneDelegate.swift */; };'),
                  ('\t\t504EC3071FED79650016851F /* AppDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };',
                   '\t\t504EC3071FED79650016851F /* AppDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };\n\t\tA85CENE20000000000000002 /* SceneDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = SceneDelegate.swift; sourceTree = "<group>"; };'),
                  ('\t\t\t\t504EC3071FED79650016851F /* AppDelegate.swift */,',
                   '\t\t\t\t504EC3071FED79650016851F /* AppDelegate.swift */,\n\t\t\t\tA85CENE20000000000000002 /* SceneDelegate.swift */,'),
                  ('\t\t\t\t504EC3081FED79650016851F /* AppDelegate.swift in Sources */,',
                   '\t\t\t\t504EC3081FED79650016851F /* AppDelegate.swift in Sources */,\n\t\t\t\tA85CENE10000000000000001 /* SceneDelegate.swift in Sources */,'),
              ]
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'Expected exactly one Xcode project anchor, found {count}: {old}')
                  text = text.replace(old, new)
              p.write_text(text)
          PY

      - name: Validate iOS scene contract and plist
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import plistlib
          with open('ios/App/App/Info.plist','rb') as f:
              p=plistlib.load(f)
          manifest=p.get('UIApplicationSceneManifest')
          assert isinstance(manifest,dict)
          assert manifest.get('UIApplicationSupportsMultipleScenes') is False
          cfg=manifest['UISceneConfigurations']['UIWindowSceneSessionRoleApplication'][0]
          assert cfg['UISceneDelegateClassName']=='$(PRODUCT_MODULE_NAME).SceneDelegate'
          assert cfg['UISceneConfigurationName']=='Default Configuration'
          print('Info.plist scene lifecycle validated')
          PY
          grep -q 'SceneDelegate.swift in Sources' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'SceneDelegateProxy.shared.scene' ios/App/App/SceneDelegate.swift
          grep -q 'configurationForConnecting' ios/App/App/AppDelegate.swift
          grep -q 'com.goldenoremar.app' ios/App/App/Info.plist

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Android Capacitor 8 baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q "com.android.tools.build:gradle:8.13.0" android/build.gradle
          grep -q "kotlin-gradle-plugin:2.2.20" android/build.gradle
          grep -q 'gradle-8.14.3-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -q 'minSdkVersion = 24' android/variables.gradle
          grep -q 'compileSdkVersion = 36' android/variables.gradle
          grep -q 'targetSdkVersion = 36' android/variables.gradle
          grep -q 'kotlin-stdlib:2.2.20' android/app/build.gradle
          grep -q 'JavaVersion.VERSION_21' android/app/build.gradle
          grep -q 'density' android/app/src/main/AndroidManifest.xml

      - name: Production build and native sync
        run: |
          npm run build
          npx cap sync android
          npx cap sync ios

      - name: Revalidate scene registration after Capacitor sync
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SceneDelegate.swift in Sources' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'UIApplicationSceneManifest' ios/App/App/Info.plist
          grep -q 'SceneDelegateProxy.shared.scene' ios/App/App/SceneDelegate.swift

      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit verified native migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-capacitor-85-native.yml
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Complete Capacitor 8.5 native platform migration'
          git push origin HEAD:agent/capacitor-8-stable-quality
