name: Verify Public Content Reliability

on:
  push:
    branches: [agent/public-content-screen-reliability]
    paths:
      - '.github/workflows/verify-public-content-reliability.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply cancellable health loading guard
        run: node migration-tools/patch-health-loading-cancel.mjs
      - name: Validate public screen contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'useAccessibleDialog<HTMLDivElement>(true' src/features/engagement/PublicEventsScreen.tsx
          grep -q 'if (busy) return;' src/features/engagement/PublicEventsScreen.tsx
          grep -q 'ref={errorRef}' src/features/engagement/PublicEventsScreen.tsx
          grep -q 'configError' src/features/engagement/PublicContactScreen.tsx
          grep -q 'Yayınlanmış iletişim bilgileri şu anda alınamadı' src/features/engagement/PublicContactScreen.tsx
          grep -q 'if (busy) return;' src/features/engagement/PublicContactScreen.tsx
          grep -q 'favoriteBusy' src/features/content/PublicHealthScreen.tsx
          grep -q 'detailRequestId' src/features/content/PublicHealthScreen.tsx
          grep -q 'cancelDetailLoading' src/features/content/PublicHealthScreen.tsx
          grep -q 'useAccessibleDialog<HTMLElement>' src/features/content/PublicHealthScreen.tsx
          grep -q 'role="dialog"' src/features/content/PublicHealthScreen.tsx
      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files=[
            'src/features/engagement/PublicEventsScreen.tsx',
            'src/features/engagement/PublicContactScreen.tsx',
            'src/features/content/PublicHealthScreen.tsx',
          ];
          let failed=false;
          for(const file of files){const result=ts.transpileModule(fs.readFileSync(file,'utf8'),{fileName:file,reportDiagnostics:true,compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX}});const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);if(errors.length){failed=true;for(const d of errors)console.error(file,ts.flattenDiagnosticMessageText(d.messageText,'\n'));}else console.log(`${file}: parse clean`);}
          if(failed)process.exit(1);
          NODE
      - name: Production web build
        run: npm run build
      - name: Clean verifier from source branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-public-content-reliability.yml
          rm -f migration-tools/patch-health-loading-cancel.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Verify public content screen reliability'
          git push origin HEAD:agent/public-content-screen-reliability
