name: Fix Admin Delta Once

on:
  push:
    branches:
      - agent/admin-supabase-retire-node

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[admin-delta-fixed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-supabase-retire-node
          fetch-depth: 0

      - name: Apply focused fixes
        shell: python
        run: |
          from pathlib import Path

          vendors = Path('src/admin/AdminVendors.tsx')
          text = vendors.read_text()
          old = "import { BadgeCheck, Check, CircleDollarSign, Eye, Loader2, MapPin, Package, RefreshCw, Search, ShieldCheck, ShoppingBag, Store, Users, X, XCircle } from 'lucide-react';"
          new = "import { BadgeCheck, Check, CheckCircle, CircleDollarSign, Eye, Loader2, MapPin, Package, RefreshCw, Search, ShieldCheck, ShoppingBag, Store, Users, X, XCircle } from 'lucide-react';"
          if old not in text:
              raise SystemExit('AdminVendors import target not found')
          vendors.write_text(text.replace(old, new, 1))

          returns = Path('src/admin/AdminReturns.tsx')
          text = returns.read_text()
          old_count = "    refundedMinor: rows.reduce((sum, row) => sum + row.succeeded_refund_minor, 0),"
          new_count = "    refunded: rows.filter(row => row.succeeded_refund_minor > 0).length,"
          if old_count not in text:
              raise SystemExit('AdminReturns count target not found')
          text = text.replace(old_count, new_count, 1)
          old_card = "<div className=\"rounded-2xl border border-gray-100 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800\"><div className=\"text-xs text-gray-500\">Başarılı geri ödeme</div><div className=\"mt-1 text-xl font-bold text-gray-900 dark:text-white\">{returnMoney(counts.refundedMinor, 'TRY')}</div><div className=\"mt-1 text-[11px] text-gray-500\">Özet kartı TRY kayıtlarını temel alır, detayda gerçek para birimi gösterilir.</div></div>"
          new_card = "<div className=\"rounded-2xl border border-gray-100 bg-white p-4 shadow-sm dark:border-gray-700 dark:bg-gray-800\"><div className=\"text-xs text-gray-500\">Başarılı geri ödeme kaydı</div><div className=\"mt-1 text-2xl font-bold text-gray-900 dark:text-white\">{counts.refunded}</div><div className=\"mt-1 text-[11px] text-gray-500\">Para birimleri birbirine karıştırılmadan yalnızca başarılı kayıt sayısı gösterilir.</div></div>"
          if old_card not in text:
              raise SystemExit('AdminReturns summary card target not found')
          returns.write_text(text.replace(old_card, new_card, 1))

          Path('.github/workflows/fix-admin-delta-once.yml').unlink()

      - name: Commit focused fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golden-oremar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix admin delta validation and currency truth [admin-delta-fixed]"
          git push origin HEAD:agent/admin-supabase-retire-node
