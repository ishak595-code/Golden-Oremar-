name: Remove Firebase Package Once

on:
  push:
    branches:
      - agent/admin-supabase-retire-node

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[firebase-package-removed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-supabase-retire-node
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Remove Firebase dependency and refresh lockfile
        run: npm uninstall firebase --save --no-audit --no-fund
      - name: Verify no Firebase runtime source remains
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE "firebase/(app|auth|firestore|storage)|from ['\"][^'\"]*firebase['\"]" -- 'src/**'; then
            echo 'Firebase runtime references still exist under src.' >&2
            exit 1
          fi
      - name: Remove this one-shot workflow
        run: rm .github/workflows/remove-firebase-package-once.yml
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golden-oremar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete Firebase dependency [firebase-package-removed]"
          git push origin HEAD:agent/admin-supabase-retire-node
