name: Apply Capacitor 8.5 Delta

on:
  push:
    branches: [agent/capacitor-85-delta]
    paths:
      - '.github/workflows/apply-capacitor-85-delta.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Apply stable Capacitor package delta
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          Object.assign(p.dependencies, {
            '@capacitor/android':'8.5.0',
            '@capacitor/app':'8.1.1',
            '@capacitor/browser':'8.0.4',
            '@capacitor/core':'8.5.0',
            '@capacitor/haptics':'8.0.2',
            '@capacitor/ios':'8.5.0',
            '@capacitor/keyboard':'8.0.5',
            '@capacitor/network':'8.0.1',
            '@capacitor/splash-screen':'8.0.2',
            '@capacitor/status-bar':'8.0.3'
          });
          p.devDependencies['@capacitor/cli']='8.5.0';
          fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');
          NODE

      - name: Align Android toolchain delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root=Path('android/build.gradle')
          s=root.read_text()
          old="classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'"
          new="classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'"
          if old not in s and new not in s: raise SystemExit('Unexpected Kotlin Gradle plugin declaration')
          root.write_text(s.replace(old,new))
          app=Path('android/app/build.gradle')
          s=app.read_text()
          old='implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"'
          new='implementation "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"'
          if old not in s and new not in s: raise SystemExit('Unexpected Kotlin stdlib declaration')
          app.write_text(s.replace(old,new))
          PY

      - name: Add Capacitor 8.5 SceneDelegate
        shell: bash
        run: |
          set -euo pipefail
          cat > ios/App/App/SceneDelegate.swift <<'SWIFT'
          import UIKit
          import Capacitor

          class SceneDelegate: UIResponder, UIWindowSceneDelegate {
              var window: UIWindow?

              func scene(_ scene: UIScene, willConnectTo session: UISceneSession, options connectionOptions: UIScene.ConnectionOptions) {
                  guard let windowScene = scene as? UIWindowScene else { return }

                  window = UIWindow(windowScene: windowScene)
                  window?.rootViewController = CAPBridgeViewController()
                  window?.makeKeyAndVisible()

                  SceneDelegateProxy.shared.scene(scene, willConnectTo: session, options: connectionOptions)
              }

              func scene(_ scene: UIScene, openURLContexts URLContexts: Set<UIOpenURLContext>) {
                  SceneDelegateProxy.shared.scene(scene, openURLContexts: URLContexts)
              }

              func scene(_ scene: UIScene, continue userActivity: NSUserActivity) {
                  SceneDelegateProxy.shared.scene(scene, continue: userActivity)
              }
          }
          SWIFT

      - name: Add AppDelegate scene configuration without removing auth proxies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('ios/App/App/AppDelegate.swift')
          s=p.read_text()
          if 'configurationForConnecting connectingSceneSession' not in s:
              anchor='''    func application(_ application: UIApplication, continue userActivity: NSUserActivity, restorationHandler: @escaping ([UIUserActivityRestoring]?) -> Void) -> Bool {\n        // Called when the app was launched with an activity, including Universal Links.\n        // Feel free to add additional processing here, but if you want the App API to support\n        // tracking app url opens, make sure to keep this call\n        return ApplicationDelegateProxy.shared.application(application, continue: userActivity, restorationHandler: restorationHandler)\n    }\n'''
              block=anchor+'''\n    func application(_ application: UIApplication,\n                     configurationForConnecting connectingSceneSession: UISceneSession,\n                     options: UIScene.ConnectionOptions) -> UISceneConfiguration {\n        let config = UISceneConfiguration(name: "Default Configuration", sessionRole: connectingSceneSession.role)\n        config.delegateClass = SceneDelegate.self\n        return config\n    }\n'''
              if s.count(anchor)!=1: raise SystemExit('Unexpected AppDelegate universal-link anchor')
              s=s.replace(anchor,block)
              p.write_text(s)
          PY

      - name: Add iOS scene manifest safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path('ios/App/App/Info.plist')
          with p.open('rb') as f: data=plistlib.load(f)
          data['UIApplicationSceneManifest']={
            'UIApplicationSupportsMultipleScenes': False,
            'UISceneConfigurations': {
              'UIWindowSceneSessionRoleApplication': [{
                'UISceneConfigurationName':'Default Configuration',
                'UISceneDelegateClassName':'$(PRODUCT_MODULE_NAME).SceneDelegate',
                'UISceneStoryboardFile':'Main'
              }]
            }
          }
          with p.open('wb') as f: plistlib.dump(data,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY

      - name: Register SceneDelegate in Xcode project using valid PBX IDs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('ios/App/App.xcodeproj/project.pbxproj')
          s=p.read_text()
          build_id='A85CE0010000000000000001'
          file_id='A85CE0020000000000000002'
          assert re.fullmatch(r'[0-9A-F]{24}',build_id)
          assert re.fullmatch(r'[0-9A-F]{24}',file_id)
          if 'SceneDelegate.swift in Sources' not in s:
              replacements=[
                ('\t\t504EC3081FED79650016851F /* AppDelegate.swift in Sources */ = {isa = PBXBuildFile; fileRef = 504EC3071FED79650016851F /* AppDelegate.swift */; };',f'\t\t504EC3081FED79650016851F /* AppDelegate.swift in Sources */ = {{isa = PBXBuildFile; fileRef = 504EC3071FED79650016851F /* AppDelegate.swift */; }};\n\t\t{build_id} /* SceneDelegate.swift in Sources */ = {{isa = PBXBuildFile; fileRef = {file_id} /* SceneDelegate.swift */; }};'),
                ('\t\t504EC3071FED79650016851F /* AppDelegate.swift */ = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; };',f'\t\t504EC3071FED79650016851F /* AppDelegate.swift */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = AppDelegate.swift; sourceTree = "<group>"; }};\n\t\t{file_id} /* SceneDelegate.swift */ = {{isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = SceneDelegate.swift; sourceTree = "<group>"; }};'),
                ('\t\t\t\t504EC3071FED79650016851F /* AppDelegate.swift */,',f'\t\t\t\t504EC3071FED79650016851F /* AppDelegate.swift */,\n\t\t\t\t{file_id} /* SceneDelegate.swift */,'),
                ('\t\t\t\t504EC3081FED79650016851F /* AppDelegate.swift in Sources */,',f'\t\t\t\t504EC3081FED79650016851F /* AppDelegate.swift in Sources */,\n\t\t\t\t{build_id} /* SceneDelegate.swift in Sources */,'),
              ]
              for old,new in replacements:
                if s.count(old)!=1: raise SystemExit(f'Unexpected PBX anchor count for {old}')
                s=s.replace(old,new)
              p.write_text(s)
          PY

      - name: Add permanent mobile quality gate
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/mobile-quality.yml <<'YAML'
          name: Mobile Quality Gate

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          concurrency:
            group: mobile-quality-${{ github.ref }}
            cancel-in-progress: true

          permissions:
            contents: read

          jobs:
            verify-mobile:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: '22'
                    cache: npm
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '21'
                - run: npm ci --no-audit --no-fund
                - name: Validate native baseline
                  shell: bash
                  run: |
                    set -euo pipefail
                    grep -q '"@capacitor/core": "8.5.0"' package.json
                    grep -q '"@capacitor/browser": "8.0.4"' package.json
                    grep -q "com.android.tools.build:gradle:8.13.0" android/build.gradle
                    grep -q "kotlin-gradle-plugin:2.2.20" android/build.gradle
                    grep -q 'gradle-8.14.3-all.zip' android/gradle/wrapper/gradle-wrapper.properties
                    grep -q 'minSdkVersion = 24' android/variables.gradle
                    grep -q 'compileSdkVersion = 36' android/variables.gradle
                    grep -q 'targetSdkVersion = 36' android/variables.gradle
                    grep -q 'JavaVersion.VERSION_21' android/app/build.gradle
                    grep -q 'kotlin-stdlib:2.2.20' android/app/build.gradle
                    grep -q 'density' android/app/src/main/AndroidManifest.xml
                    grep -q 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;' ios/App/App.xcodeproj/project.pbxproj
                    grep -q 'SceneDelegate.swift in Sources' ios/App/App.xcodeproj/project.pbxproj
                    grep -q 'SceneDelegateProxy.shared.scene' ios/App/App/SceneDelegate.swift
                    grep -q 'UIApplicationSceneManifest' ios/App/App/Info.plist
                    grep -q 'configurationForConnecting' ios/App/App/AppDelegate.swift
                    grep -q 'VITE_AUTH_GOOGLE_ENABLED' .env.example
                    grep -q 'VITE_AUTH_FACEBOOK_ENABLED' .env.example
                    grep -q '@capacitor/browser' src/features/auth/api.ts
                - run: npm run build
                - run: npx cap sync android && npx cap sync ios
                - name: Ensure native sync is reproducible
                  shell: bash
                  run: |
                    set -euo pipefail
                    if ! git diff --quiet; then
                      git diff --stat
                      git diff
                      exit 1
                    fi
                - name: Android debug build
                  working-directory: android
                  run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon
          YAML

      - name: Refresh lockfile
        run: npm install --no-audit --no-fund

      - name: Validate locked package versions and existing social auth
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const expected={
            '@capacitor/core':'8.5.0','@capacitor/android':'8.5.0','@capacitor/ios':'8.5.0','@capacitor/cli':'8.5.0',
            '@capacitor/browser':'8.0.4','@capacitor/app':'8.1.1','@capacitor/haptics':'8.0.2','@capacitor/keyboard':'8.0.5',
            '@capacitor/network':'8.0.1','@capacitor/splash-screen':'8.0.2','@capacitor/status-bar':'8.0.3'
          };
          for(const [name,v] of Object.entries(expected)){
            const actual=lock.packages?.[`node_modules/${name}`]?.version;
            if(actual!==v) throw new Error(`${name}: expected ${v}, got ${actual}`);
          }
          NODE
          grep -q 'VITE_AUTH_GOOGLE_ENABLED' .env.example
          grep -q 'VITE_AUTH_FACEBOOK_ENABLED' .env.example
          grep -q '@capacitor/browser' src/features/auth/api.ts
          grep -q 'signInWithOAuth' src/features/auth/api.ts

      - name: Validate iOS scene data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import plistlib,re
          from pathlib import Path
          with open('ios/App/App/Info.plist','rb') as f: d=plistlib.load(f)
          m=d['UIApplicationSceneManifest']
          assert m['UIApplicationSupportsMultipleScenes'] is False
          cfg=m['UISceneConfigurations']['UIWindowSceneSessionRoleApplication'][0]
          assert cfg['UISceneDelegateClassName']=='$(PRODUCT_MODULE_NAME).SceneDelegate'
          s=Path('ios/App/App.xcodeproj/project.pbxproj').read_text()
          for oid in ('A85CE0010000000000000001','A85CE0020000000000000002'):
            assert re.fullmatch(r'[0-9A-F]{24}',oid) and oid in s
          PY

      - name: Production build and native sync
        run: |
          npm run build
          npx cap sync android
          npx cap sync ios

      - name: Verify sync retained auth and scene integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SceneDelegate.swift in Sources' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'SceneDelegateProxy.shared.scene' ios/App/App/SceneDelegate.swift
          grep -q 'com.goldenoremar.app' ios/App/App/Info.plist
          grep -q 'android:scheme="com.goldenoremar.app"' android/app/src/main/AndroidManifest.xml

      - name: Compile Android debug app
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --no-daemon

      - name: Update persistent implementation status
        shell: bash
        run: |
          cat > docs/IMPLEMENTATION_STATUS.md <<'MD'
          # Golden Oremar Implementation Status

          Last updated: 2026-08-16

          This file is intentionally concise. Detailed sequencing lives in `MOBILE_PRODUCT_ROADMAP.md`; persistence rules live in `PERSISTENCE_AND_CHANGE_LEDGER.md`.

          ## Current phase
          Mobile-first customer experience hardening before admin-panel finalization.

          ## Completed platform/auth package
          - Stable Capacitor 8.5 core/platform baseline with locked official plugin versions.
          - Android API 36, minSdk 24, Java 21, Kotlin 2.2.20, Gradle 8.14.3 and AGP 8.13.0.
          - iOS deployment target 15.0 with Capacitor 8.5 UIScene lifecycle and preserved auth deep-link routing.
          - Provider-gated Google/Facebook OAuth remains integrated through the existing Supabase/deep-link session flow; buttons remain disabled unless explicitly enabled.
          - Permanent mobile CI gate verifies production build, native sync reproducibility and Android debug compilation.

          ## Current active package
          Dynamic product-card/store metrics: review summary, verified producer, follower count, stock/variant truth and follow state.

          ## Release gates still required on Apple hardware
          A real Xcode archive/build and VoiceOver/device pass are required before App Store release; Linux CI cannot substitute for an Apple toolchain build.
          MD

      - name: Commit only verified delta
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-capacitor-85-delta.yml
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Complete Capacitor 8.5 native compatibility delta'
          git push origin HEAD:agent/capacitor-85-delta
