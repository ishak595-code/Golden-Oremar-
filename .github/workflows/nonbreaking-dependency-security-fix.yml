name: Nonbreaking Dependency Security Fix

on:
  push:
    branches:
      - agent/nonbreaking-dependency-security-fix

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nonbreaking-dependency-security-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Capture direct dependency contract
        run: cp package.json /tmp/package-before.json
      - name: Apply npm audit fixes without force
        run: |
          npm audit fix || true
      - name: Reject direct major-version drift
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before=JSON.parse(fs.readFileSync('/tmp/package-before.json','utf8'));
          const after=JSON.parse(fs.readFileSync('package.json','utf8'));
          const groups=['dependencies','devDependencies'];
          const major=(range='')=>{const m=String(range).match(/(\d+)/);return m?Number(m[1]):null};
          for(const group of groups){
            for(const [name,oldRange] of Object.entries(before[group]||{})){
              const newRange=after[group]?.[name];
              if(newRange==null)throw new Error(`Direct dependency removed unexpectedly: ${name}`);
              const oldMajor=major(oldRange), newMajor=major(newRange);
              if(oldMajor!==null&&newMajor!==null&&oldMajor!==newMajor)throw new Error(`Major version drift: ${name} ${oldRange} -> ${newRange}`);
            }
          }
          console.log('Direct dependency major versions preserved.');
          NODE
      - name: Audit security improvement
        run: |
          npm audit --json > /tmp/audit-after.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/audit-after.json','utf8'));
          const v=report.metadata?.vulnerabilities||{};
          console.log('AFTER_NONBREAKING_AUDIT='+JSON.stringify(v));
          const critical=Number(v.critical||0), high=Number(v.high||0), total=Number(v.total||0);
          if(critical!==0 || high!==0 || total>4)throw new Error(`Expected zero critical/high and <=4 total, got critical=${critical} high=${high} total=${total}`);
          NODE
      - name: Print resolved security-sensitive versions
        run: |
          npm ls vite firebase express @capacitor/cli tar protobufjs @grpc/grpc-js path-to-regexp postcss ws esbuild uuid xcode --all || true
      - name: Production web build
        run: npm run build
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified nonbreaking security updates
        run: |
          rm -f .github/workflows/nonbreaking-dependency-security-fix.yml
          git config user.name "Golden Oremar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/nonbreaking-dependency-security-fix.yml
          if git diff --cached --quiet; then
            echo "No dependency changes were needed"
            exit 0
          fi
          git commit -m "Apply nonbreaking dependency security updates [skip ci]"
          git push origin HEAD:agent/nonbreaking-dependency-security-fix
