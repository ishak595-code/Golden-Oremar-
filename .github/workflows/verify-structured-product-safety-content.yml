name: Final Verify Structured Product Safety Content

on:
  push:
    branches: [agent/structured-product-safety-content]
    paths:
      - '.github/workflows/verify-structured-product-safety-content.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Integrate product detail safety panel
        run: node migration-tools/integrate-product-safety-detail.mjs

      - name: Validate structured safety contracts and migration persistence
        shell: bash
        run: |
          set -euo pipefail
          grep -q "get_public_content_entry_v2" src/features/content/api.ts
          grep -q "get_public_product_safety_v1" src/features/content/productSafetyApi.ts
          grep -q "ProductSafetyPanel" src/features/content/PublicHealthScreen.tsx
          grep -q "ProductSafetyPanel" src/features/catalog/ProductDetailScreen.tsx
          grep -q "getProductSafety(reference,'tr')" src/features/catalog/ProductDetailScreen.tsx
          grep -q "safetyContent?.safety" src/features/catalog/ProductDetailScreen.tsx
          test -f supabase/migrations/20260816160543_archive_and_harden_public_product_safety_v1.sql
          test -f supabase/migrations/20260816161038_initialize_structured_product_safety_content_v2.sql
          test -f supabase/migrations/20260816161122_fix_structured_product_safety_classification_v2.sql
          test -f supabase/migrations/20260816161255_enrich_animal_honey_produce_safety_v2.sql
          test -f supabase/migrations/20260816161325_enrich_pantry_beverage_nonfood_safety_v2.sql
          test -f supabase/migrations/20260816161342_add_public_product_safety_content_api_v1.sql
          test -f supabase/migrations/20260816161413_polish_structured_product_safety_copy_v2.sql
          test -f supabase/migrations/20260816162315_classify_dried_persimmon_product_safety_v2.sql

      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          const files = [
            'src/features/content/ProductSafetyPanel.tsx',
            'src/features/content/productSafetyApi.ts',
            'src/features/content/api.ts',
            'src/features/content/PublicHealthScreen.tsx',
            'src/features/catalog/ProductDetailScreen.tsx',
          ];
          for (const file of files) {
            const text = fs.readFileSync(file,'utf8');
            const sf = ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,file.endsWith('.tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
            if (sf.parseDiagnostics.length) {
              console.error(file, sf.parseDiagnostics.map(d => d.messageText));
              process.exitCode = 1;
            }
          }
          NODE

      - name: Production web build
        run: npm run build

      - name: Synchronize native projects
        run: |
          npx cap sync android
          npx cap sync ios

      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit verified final state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-structured-product-safety-content.yml
          rm -f migration-tools/integrate-product-safety-detail.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Complete structured product safety content UI'
          git push origin HEAD:agent/structured-product-safety-content
