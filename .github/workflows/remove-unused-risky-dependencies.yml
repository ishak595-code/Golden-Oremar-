name: Remove Unused Risky Dependencies

on:
  push:
    branches:
      - agent/remove-unused-risky-dependencies

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-unused-risky-dependencies
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Remove confirmed unused runtime dependencies
        run: |
          npm uninstall @google/genai nodemailer cookie cookie-parser
          npm uninstall --save-dev @types/cookie-parser
      - name: Verify removed packages have no source imports
        run: |
          ! git grep -n "@google/genai" -- '*.ts' '*.tsx' '*.js' '*.mjs'
          ! git grep -n "nodemailer" -- '*.ts' '*.tsx' '*.js' '*.mjs'
          ! git grep -n "cookie-parser" -- '*.ts' '*.tsx' '*.js' '*.mjs'
          ! git grep -nE "from ['\"]cookie['\"]|require\(['\"]cookie['\"]\)" -- '*.ts' '*.tsx' '*.js' '*.mjs'
      - name: Audit dependency reduction
        run: |
          npm audit --json > /tmp/audit.json || true
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const v=report.metadata?.vulnerabilities||{};
          console.log('AFTER_AUDIT='+JSON.stringify(v));
          const items=report.vulnerabilities||{};
          if(items.nodemailer) throw new Error('nodemailer vulnerability path still present');
          if(items.ws && JSON.stringify(items.ws).includes('@google/genai')) throw new Error('@google/genai ws path still present');
          const critical=Number(v.critical||0), high=Number(v.high||0), total=Number(v.total||0);
          if(critical>3 || high>=10 || total>=22) throw new Error(`Audit did not improve enough: critical=${critical} high=${high} total=${total}`);
          NODE
      - name: Production web build
        run: npm run build
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified dependency cleanup
        run: |
          rm -f .github/workflows/remove-unused-risky-dependencies.yml
          git config user.name "Golden Oremar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/remove-unused-risky-dependencies.yml
          git commit -m "Remove unused risky dependencies [skip ci]"
          git push origin HEAD:agent/remove-unused-risky-dependencies
