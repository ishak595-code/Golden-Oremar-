name: Verify Notification Badge Sync

on:
  push:
    branches: [agent/notification-badge-sync]
    paths:
      - '.github/workflows/verify-notification-badge-sync.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Integrate server-backed badge
        run: node migration-tools/integrate-notification-badge.mjs
      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files=['src/App.tsx','src/features/account/AccountCenter.tsx','src/features/account/NotificationsPanel.tsx','src/features/account/useUnreadNotificationCount.ts'];
          let bad=0;
          for(const file of files){
            const source=fs.readFileSync(file,'utf8');
            const out=ts.transpileModule(source,{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX},reportDiagnostics:true,fileName:file});
            const errors=(out.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
            if(errors.length){bad+=errors.length;console.error(file,errors.map(e=>ts.flattenDiagnosticMessageText(e.messageText,'\n')).join('\n'));}
          }
          if(bad)process.exit(1);
          console.log('Changed modules parse cleanly');
          NODE
      - name: Validate notification data source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'listNotifications(1)' src/features/account/useUnreadNotificationCount.ts
          grep -q "appStateChange" src/features/account/useUnreadNotificationCount.ts
          grep -q "window.addEventListener('focus'" src/features/account/useUnreadNotificationCount.ts
          grep -q 'onUnreadCountChange' src/features/account/NotificationsPanel.tsx
          grep -q 'onUnreadNotificationCountChange' src/features/account/AccountCenter.tsx
          grep -q 'useUnreadNotificationCount(!!currentUser)' src/App.tsx
          grep -q 'onUnreadNotificationCountChange={setUnreadCount}' src/App.tsx
          ! grep -q 'notifications.filter(n => !n.read)' src/App.tsx
          ! grep -q 'showNotifications' src/App.tsx
          test "$(grep -c 'okunmamış' src/App.tsx)" -ge 2
      - name: Production web build
        run: npm run build
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified notification integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-notification-badge-sync.yml
          rm -f migration-tools/integrate-notification-badge.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Use Supabase unread notifications across app shell'
          git push origin HEAD:agent/notification-badge-sync
