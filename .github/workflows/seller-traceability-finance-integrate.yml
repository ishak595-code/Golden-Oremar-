name: Verify Seller Traceability and Finance

on:
  push:
    branches: [agent/seller-traceability-finance]
    paths:
      - '.github/workflows/seller-traceability-finance-integrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seller-traceability-finance
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Integrate SellerPanel
        run: node migration-tools/integration/apply-seller-traceability-finance.mjs src/features/account/SellerPanel.tsx
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/seller-traceability-finance-integrate.yml
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate seller traceability and finance'
          git push origin HEAD:agent/seller-traceability-finance
