name: Verify Native Auth Recovery

on:
  push:
    branches: [agent/native-auth-recovery]
    paths:
      - '.github/workflows/verify-native-auth-recovery.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Integrate recovery coordinator into App
        run: node migration-tools/integrate-auth-recovery.mjs
      - name: Validate auth recovery source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "detectSessionInUrl: !Capacitor.isNativePlatform()" src/lib/supabase.ts
          grep -q "NATIVE_AUTH_CALLBACK_URL = 'com.goldenoremar.app://auth/callback'" src/features/auth/api.ts
          grep -q "VITE_NATIVE_AUTH_REDIRECT_URL" src/features/auth/api.ts
          grep -q "nativeConfigured === NATIVE_AUTH_CALLBACK_URL" src/features/auth/api.ts
          grep -q "native_auth_redirect_not_configured" src/features/auth/api.ts
          grep -q "exchangeCodeForSession" src/features/auth/api.ts
          grep -q "setSession" src/features/auth/api.ts
          grep -q "updateUser({ password })" src/features/auth/api.ts
          grep -q "PASSWORD_RECOVERY" src/features/auth/useAuthRecoveryCoordinator.ts
          grep -q "getLaunchUrl" src/features/auth/useAuthRecoveryCoordinator.ts
          grep -q "appUrlOpen" src/features/auth/useAuthRecoveryCoordinator.ts
          grep -q "PasswordRecoveryScreen" src/App.tsx
          grep -q "authRecovery.recoveryPending" src/App.tsx
          grep -q "VITE_AUTH_REDIRECT_URL=" .env.example
          grep -q "VITE_NATIVE_AUTH_REDIRECT_URL=com.goldenoremar.app://auth/callback" .env.example
          grep -q 'android:scheme="com.goldenoremar.app"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:host="auth"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:pathPrefix="/callback"' android/app/src/main/AndroidManifest.xml
          grep -q '<string>com.goldenoremar.app</string>' ios/App/App/Info.plist
          python - <<'PY'
          import plistlib
          with open('ios/App/App/Info.plist','rb') as f:
              plist=plistlib.load(f)
          url_types=plist.get('CFBundleURLTypes', [])
          schemes=[s for item in url_types for s in item.get('CFBundleURLSchemes', [])]
          assert 'com.goldenoremar.app' in schemes
          print('iOS auth URL scheme validated')
          PY
      - name: Production web build
        run: npm run build
      - name: Synchronize Capacitor projects
        run: |
          npx cap sync android
          npx cap sync ios
      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified auth recovery integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-native-auth-recovery.yml
          rm -f migration-tools/integrate-auth-recovery.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Complete fail-safe native auth recovery flow'
          git push origin HEAD:agent/native-auth-recovery
