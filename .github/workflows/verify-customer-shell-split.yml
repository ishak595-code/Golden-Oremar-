name: Verify Customer Shell Split

on:
  push:
    branches:
      - agent/customer-shell-firebase-split

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/customer-shell-firebase-split
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded customer shell split
        run: node .github/scripts/apply-customer-shell-split.mjs
      - name: Validate trust and import boundaries
        run: |
          grep -q "useCustomerSession" src/App.tsx
          grep -q "LegacyAdminEntry" src/App.tsx
          ! grep -q "DataProvider" src/App.tsx
          ! grep -q "context/DataContext" src/App.tsx
          ! grep -q "firebase/firestore" src/App.tsx
          ! grep -q "from './data'" src/App.tsx
          ! grep -q "goldenoremar@gmail.com" src/pages/AdminPage.tsx
          ! grep -q "ramcofero.yt@gmail.com" src/pages/AdminPage.tsx
          grep -q "roles.includes('admin')" src/pages/AdminPage.tsx
          grep -q "initialCurrentUser" src/context/DataContext.tsx
      - name: Parse changed TypeScript modules
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const files=['src/App.tsx','src/features/auth/useCustomerSession.ts','src/pages/LegacyAdminEntry.tsx','src/pages/AdminPage.tsx','src/context/DataContext.tsx'];
          let failed=false;
          for(const file of files){const r=ts.transpileModule(fs.readFileSync(file,'utf8'),{compilerOptions:{jsx:ts.JsxEmit.ReactJSX,target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext},reportDiagnostics:true,fileName:file});const errors=(r.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);if(errors.length){failed=true;console.error(file,errors.map(d=>ts.flattenDiagnosticMessageText(d.messageText,'\n')));}}
          if(failed)process.exit(1);
          NODE
      - name: Production web build and startup budget
        run: |
          npm run build 2>&1 | tee /tmp/build.log
          ENTRY=$(grep -o 'assets/index-[^" ]*\.js' dist/index.html | head -1)
          test -n "$ENTRY"
          BYTES=$(stat -c%s "dist/$ENTRY")
          echo "CUSTOMER_ENTRY_BYTES=$BYTES"
          echo "PREVIOUS_ENTRY_BYTES=1136759"
          SAVED=$((1136759-BYTES))
          echo "CUSTOMER_ENTRY_BYTES_SAVED=$SAVED"
          test "$SAVED" -ge 90000
          test "$BYTES" -lt 1050000
      - name: Diagnose remaining Firebase startup path
        run: |
          echo '--- Firebase imports remaining in source tree ---'
          grep -RInE "from ['\"]firebase|from ['\"][^'\"]*firebase|import\(['\"][^'\"]*firebase" src --include='*.ts' --include='*.tsx' || true
          echo '--- Built entry marker context ---'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('dist/index.html','utf8');
          const match=html.match(/assets\/index-[^"']+\.js/);
          if(!match)throw new Error('entry asset missing');
          const entry=fs.readFileSync('dist/'+match[0],'utf8');
          for(const marker of ['Firestore','firebaseapp.com','@firebase']){
            const index=entry.indexOf(marker);
            console.log(`MARKER_${marker}=${index}`);
            if(index>=0)console.log(entry.slice(Math.max(0,index-500),Math.min(entry.length,index+900)));
          }
          NODE
      - name: Confirm Firebase moved behind lazy boundary
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('dist/index.html','utf8');
          const match=html.match(/assets\/index-[^"']+\.js/);
          if(!match)throw new Error('entry asset missing');
          const entry=fs.readFileSync('dist/'+match[0],'utf8');
          const forbidden=['Firestore','firebaseapp.com','@firebase'];
          for(const marker of forbidden){if(entry.includes(marker))throw new Error(`Firebase marker remained in customer entry: ${marker}`);}
          NODE
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified customer shell split
        run: |
          rm -f .github/scripts/apply-customer-shell-split.mjs .github/workflows/verify-customer-shell-split.yml
          git config user.name "Golden Oremar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Detach customer startup shell from legacy Firebase admin data [skip ci]"
          git push origin HEAD:agent/customer-shell-firebase-split
