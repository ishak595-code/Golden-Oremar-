name: Premium Mobile UI V2

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - integration/full-consolidation-2026-08
      - release/ux-professionalization-2026-08

permissions:
  contents: read

concurrency:
  group: premium-mobile-ui-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewport-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://rmfcziawxjgcnxexbrvw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n4P4WYheJjOzgjO90Ko_jA_vh3CS8Vg
      VITE_PUBLIC_APP_ORIGIN: http://127.0.0.1:4173
      E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit Premium Mobile architecture
        run: node scripts/premium-mobile-ui-v2-contract-audit.mjs
      - name: TypeScript zero-error gate
        run: npx tsc --noEmit
      - name: Build production application
        run: npm run build
      - name: Install pinned Chromium viewport runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Start production preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/golden-oremar-premium-mobile-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/?tab=home >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/golden-oremar-premium-mobile-preview.log
          exit 1
      - name: Verify product-card runtime accessibility
        run: node scripts/product-card-accessibility-e2e.mjs
      - name: Verify 320-430px Premium Mobile viewports
        run: node scripts/premium-mobile-viewport-e2e.mjs
      - name: Upload Premium Mobile viewport evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golden-oremar-premium-mobile-${{ github.sha }}
          path: e2e-artifacts/*
          if-no-files-found: error
          retention-days: 14
