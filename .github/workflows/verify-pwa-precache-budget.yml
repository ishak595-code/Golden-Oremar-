name: Verify PWA Customer Precache

on:
  push:
    branches:
      - agent/pwa-customer-precache-budget

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pwa-customer-precache-budget
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Production web build
        run: npm run build 2>&1 | tee /tmp/build.log
      - name: Validate customer precache budget
        run: |
          grep -q "globIgnores" vite.config.ts
          ! grep -q "LegacyAdminEntry" dist/sw.js
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const sw=fs.readFileSync('dist/sw.js','utf8');
          const urls=[...sw.matchAll(/url:\"([^\"]+)\"/g)].map(match=>match[1]);
          if(!urls.length)throw new Error('Workbox precache manifest URLs not found');
          if(urls.some(url=>url.includes('LegacyAdminEntry')))throw new Error('Legacy admin chunk remained in customer precache');
          let bytes=0;
          for(const raw of urls){
            const clean=raw.split('?')[0].replace(/^\//,'');
            const file=path.join('dist',clean);
            if(fs.existsSync(file)&&fs.statSync(file).isFile())bytes+=fs.statSync(file).size;
          }
          console.log(`CUSTOMER_PRECACHE_FILES=${urls.length}`);
          console.log(`CUSTOMER_PRECACHE_BYTES=${bytes}`);
          if(bytes>=1400000)throw new Error(`Customer precache budget exceeded: ${bytes}`);
          NODE
      - name: Synchronize Android project
        run: npx cap sync android
      - name: Compile Android debug app
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Commit verified PWA budget
        run: |
          rm -f .github/workflows/verify-pwa-precache-budget.yml
          git config user.name "Golden Oremar Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep legacy admin bundle out of customer PWA precache [skip ci]"
          git push origin HEAD:agent/pwa-customer-precache-budget
