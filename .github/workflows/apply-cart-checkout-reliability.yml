name: Apply Cart Checkout Reliability

on:
  push:
    branches: [agent/cart-checkout-interaction-reliability]
    paths:
      - '.github/workflows/apply-cart-checkout-reliability.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply exact cart checkout patch
        run: node migration-tools/patch-cart-checkout-reliability.mjs
      - name: Validate cart reliability contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'rowBusyId' src/features/cart/CartCheckoutFlow.tsx
          grep -q 'clearConfirmOpen' src/features/cart/CartCheckoutFlow.tsx
          grep -q 'role="alertdialog"' src/features/cart/CartCheckoutFlow.tsx
          grep -q 'ref={errorRef}' src/features/cart/CartCheckoutFlow.tsx
          grep -q 'if (submitting || !cart?.items?.length) return;' src/features/cart/CartCheckoutFlow.tsx
          grep -q 'aria-busy={rowBusy}' src/features/cart/CartCheckoutFlow.tsx
          grep -q 'useAccessibleDialog<HTMLDivElement>' src/features/cart/CartCheckoutFlow.tsx
          ! grep -q 'onClick={emptyCart}' src/features/cart/CartCheckoutFlow.tsx
          ! grep -q 'onClick={submit}' src/features/cart/CartCheckoutFlow.tsx
      - name: Parse CartCheckoutFlow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const file='src/features/cart/CartCheckoutFlow.tsx';
          const result=ts.transpileModule(fs.readFileSync(file,'utf8'),{fileName:file,reportDiagnostics:true,compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.ESNext,jsx:ts.JsxEmit.ReactJSX}});
          const errors=(result.diagnostics||[]).filter(d=>d.category===ts.DiagnosticCategory.Error);
          if(errors.length){for(const d of errors)console.error(ts.flattenDiagnosticMessageText(d.messageText,'\n'));process.exit(1)}
          console.log('CartCheckoutFlow parse clean');
          NODE
      - name: Production web build
        run: npm run build
      - name: Commit verified source and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-cart-checkout-reliability.yml
          rm -f migration-tools/patch-cart-checkout-reliability.mjs
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Harden cart checkout interactions'
          git push origin HEAD:agent/cart-checkout-interaction-reliability
