name: Retire Legacy Node Once

on:
  push:
    branches:
      - agent/admin-supabase-retire-node

permissions:
  contents: write

jobs:
  retire:
    if: ${{ !contains(github.event.head_commit.message, '[node-retired]') && !contains(github.event.head_commit.message, '[cleanup-workflow]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/admin-supabase-retire-node
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Fix campaign slug edit state
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/admin/AdminCampaigns.tsx')
          text = path.read_text()
          text = text.replace(
              "  const [editingCampaign, setEditingCampaign] = useState<AdminCampaign | null>(null);\n  const [form, setForm] = useState<FormState>(initialForm);",
              "  const [editingCampaign, setEditingCampaign] = useState<AdminCampaign | null>(null);\n  const [slugTouched, setSlugTouched] = useState(false);\n  const [form, setForm] = useState<FormState>(initialForm);"
          )
          text = text.replace(
              "    setEditingCampaign(null);\n    setForm(initialForm());",
              "    setEditingCampaign(null);\n    setSlugTouched(false);\n    setForm(initialForm());"
          )
          text = text.replace(
              "    setEditingCampaign(campaign);\n    setForm(campaignToForm(campaign));",
              "    setEditingCampaign(campaign);\n    setSlugTouched(true);\n    setForm(campaignToForm(campaign));"
          )
          text = text.replace(
              "      slug: editingCampaign || current.slug ? current.slug : slugifyCampaign(title),",
              "      slug: slugTouched ? current.slug : slugifyCampaign(title),"
          )
          old = "<input required value={form.slug} onChange={event => setForm(current => ({ ...current, slug: slugifyCampaign(event.target.value) }))}"
          new = "<input required value={form.slug} onChange={event => { setSlugTouched(true); setForm(current => ({ ...current, slug: slugifyCampaign(event.target.value) })); }}"
          if old not in text:
              raise SystemExit('slug input patch target not found')
          text = text.replace(old, new)
          path.write_text(text)

      - name: Remove obsolete Node SQLite runtime
        shell: bash
        run: |
          set -euo pipefail
          npm uninstall express better-sqlite3 bcryptjs jsonwebtoken stripe cors dotenv
          npm uninstall --save-dev @types/better-sqlite3 @types/cors @types/bcryptjs @types/jsonwebtoken @types/express tsx
          npm pkg set scripts.dev="vite"
          rm -rf server server.ts reset_admin.ts reset_password.ts check_pass.ts test_login.ts

      - name: Verify no legacy local API callers remain
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE "['\"]\/api\/|fetch\([^\n]*\/api\/|axios[^\n]*\/api\/" -- ':!package-lock.json' ':!.github/**' ':!supabase/**'; then
            echo 'Legacy local API caller remains outside Supabase.' >&2
            exit 1
          fi
          if git grep -nE "server\.ts|server/db|database\.sqlite" -- ':!package-lock.json' ':!.github/**' ':!docs/**' ':!CHANGELOG.md' ':!PROJECT_STATE.json'; then
            echo 'Legacy Node or SQLite runtime reference remains.' >&2
            exit 1
          fi

      - name: Install locked production tree
        run: npm ci --no-audit --no-fund

      - name: Typecheck changed admin package
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee /tmp/typecheck.log
          status=${PIPESTATUS[0]}
          set -e
          if grep -E "src/admin/(AdminCampaigns|AdminFinance|AdminReviews|supabaseAdminApi)\.(ts|tsx).*error TS" /tmp/typecheck.log; then
            echo 'TypeScript errors found in changed admin files.' >&2
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo 'Repository has TypeScript findings outside this changed admin package; logged for follow-up.'
          fi

      - name: Production build
        run: npm run build

      - name: Commit generated lockfile and retirement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "golden-oremar-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo 'No retirement changes to commit.'
            exit 0
          fi
          git commit -m "Retire obsolete Node SQLite runtime [node-retired]"
          git push origin HEAD:agent/admin-supabase-retire-node
