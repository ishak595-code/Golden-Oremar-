name: Verify FAQ Help Center

on:
  push:
    branches: [agent/faq-help-center]
    paths:
      - '.github/workflows/verify-faq-help-center.yml'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate FAQ contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "list_public_faq_v1" src/features/account/faqApi.ts
          grep -q "Sıkça Sorulan Sorular" src/features/account/SupportPanel.tsx
          grep -q "fallbackUsed" src/features/account/SupportPanel.tsx
          grep -q "type=\"search\"" src/features/account/SupportPanel.tsx
          grep -q "<details" src/features/account/SupportPanel.tsx
          test -f supabase/migrations/20260816163725_add_public_faq_content_v1.sql

      - name: Parse changed TypeScript modules
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const ts = require('typescript');
          const fs = require('fs');
          const files = ['src/features/account/faqApi.ts','src/features/account/SupportPanel.tsx'];
          let failed = false;
          for (const file of files) {
            const text = fs.readFileSync(file,'utf8');
            const sf = ts.createSourceFile(file,text,ts.ScriptTarget.Latest,true,file.endsWith('.tsx')?ts.ScriptKind.TSX:ts.ScriptKind.TS);
            if (sf.parseDiagnostics.length) {
              failed = true;
              console.error(file, sf.parseDiagnostics.map(d=>d.messageText));
            }
          }
          if (failed) process.exit(1);
          NODE

      - name: Production web build
        run: npm run build

      - name: Synchronize native projects
        run: |
          npx cap sync android
          npx cap sync ios

      - name: Compile Android debug app
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Commit verified FAQ help center
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/verify-faq-help-center.yml
          git config user.name 'Golden Oremar Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Complete searchable FAQ help center'
          git push origin HEAD:agent/faq-help-center
