name: Audit Startup DataContext

on:
  push:
    branches:
      - agent/startup-datacontext-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/startup-datacontext-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit App useData references
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import ts from 'typescript';
          const file='src/App.tsx';
          const sourceText=fs.readFileSync(file,'utf8');
          const sf=ts.createSourceFile(file,sourceText,ts.ScriptTarget.Latest,true,ts.ScriptKind.TSX);
          const names=[];
          function visit(node){
            if(ts.isVariableDeclaration(node)&&ts.isObjectBindingPattern(node.name)&&node.initializer&&ts.isCallExpression(node.initializer)&&node.initializer.expression.getText(sf)==='useData'){
              for(const el of node.name.elements){if(ts.isIdentifier(el.name))names.push(el.name.text);}
            }
            ts.forEachChild(node,visit);
          }
          visit(sf);
          const counts={};
          for(const name of names)counts[name]=0;
          function count(node){
            if(ts.isIdentifier(node)&&Object.hasOwn(counts,node.text)){
              const p=node.parent;
              const isBinding=ts.isBindingElement(p)&&p.name===node;
              if(!isBinding)counts[node.text]++;
            }
            ts.forEachChild(node,count);
          }
          count(sf);
          console.log('USE_DATA_REFERENCE_COUNTS='+JSON.stringify(counts));
          NODE
      - name: Audit direct startup imports
        run: |
          echo '--- App direct Firebase imports ---'
          grep -n "firebase\|DataContext" src/App.tsx || true
          echo '--- DataContext static imports ---'
          sed -n '1,15p' src/context/DataContext.tsx
          echo '--- main wrapper ---'
          grep -n "DataProvider\|<App" src/App.tsx | tail -10 || true
      - name: Production build measurement
        run: npm run build 2>&1 | tee /tmp/build.log
      - name: Print largest built JS chunks
        run: |
          find dist/assets -maxdepth 1 -type f -name '*.js' -printf '%s %f\n' | sort -nr | head -15
      - name: Esbuild input weight audit
        run: |
          node --input-type=module <<'NODE'
          import * as esbuild from 'esbuild';
          const result=await esbuild.build({
            entryPoints:['src/main.tsx'],bundle:true,write:false,metafile:true,format:'esm',platform:'browser',target:'es2022',jsx:'automatic',
            loader:{'.css':'empty','.svg':'dataurl','.png':'dataurl','.jpg':'dataurl','.jpeg':'dataurl','.webp':'dataurl'},
            logLevel:'silent'
          });
          const rows=Object.entries(result.metafile.inputs).map(([name,info])=>({name,bytes:info.bytes||0})).sort((a,b)=>b.bytes-a.bytes).slice(0,35);
          console.log('TOP_ESBUILD_INPUTS');
          for(const row of rows)console.log(`${row.bytes}\t${row.name}`);
          const firebase=Object.entries(result.metafile.inputs).filter(([name])=>name.includes('firebase')||name.includes('@firebase')).reduce((sum,[,info])=>sum+(info.bytes||0),0);
          const legacy=Object.entries(result.metafile.inputs).filter(([name])=>name.includes('src/data')||name.includes('DataContext')).reduce((sum,[,info])=>sum+(info.bytes||0),0);
          console.log(`FIREBASE_INPUT_BYTES=${firebase}`);
          console.log(`LEGACY_CONTEXT_DATA_INPUT_BYTES=${legacy}`);
          NODE
