name: Staff Owner Security E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: staff-owner-security-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staff-owner-security-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: https://rmfcziawxjgcnxexbrvw.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_n4P4WYheJjOzgjO90Ko_jA_vh3CS8Vg
      E2E_CI_CONTROL_URL: https://rmfcziawxjgcnxexbrvw.supabase.co/functions/v1/ci-e2e-user
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify staff MFA static contract
        run: node scripts/staff-mfa-contract-audit.mjs
      - name: Request short-lived GitHub OIDC token for staff E2E control
        shell: bash
        run: |
          set -euo pipefail
          separator='?'
          if [[ "${ACTIONS_ID_TOKEN_REQUEST_URL}" == *'?'* ]]; then separator='&'; fi
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}${separator}audience=golden-oremar-ci-e2e")"
          token="$(node -e "const value=JSON.parse(process.argv[1]).value||'';if(!value)process.exit(2);process.stdout.write(value)" "$response")"
          echo "::add-mask::$token"
          echo "E2E_CI_OIDC_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run real-JWT staff MFA owner and catalog media E2E
        run: node scripts/staff-mfa-e2e.mjs
