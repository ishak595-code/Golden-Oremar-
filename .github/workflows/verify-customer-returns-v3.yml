name: Verify Customer Returns V3

on:
  push:
    branches: [agent/customer-returns-v3]
    paths:
      - '.github/workflows/verify-customer-returns-v3.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Verify return integration sources
        shell: bash
        run: |
          set -euo pipefail
          grep -q "request_customer_return_v3" src/features/account/returnsApi.ts
          grep -q "ReturnRequestDialog" src/features/account/OrdersPanel.tsx
          grep -q "ReturnDetailDialog" src/features/account/OrdersPanel.tsx
          grep -q "return-evidence" src/features/account/returnsApi.ts
          grep -q "get_my_order_return_options_v1" src/features/account/returnsApi.ts
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Production build
        run: npm run build
