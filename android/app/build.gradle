apply plugin: 'com.android.application'

def releaseSigningValues = [
    storeFilePath: System.getenv('ANDROID_KEYSTORE_FILE'),
    storePasswordValue: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    keyAliasValue: System.getenv('ANDROID_KEY_ALIAS'),
    keyPasswordValue: System.getenv('ANDROID_KEY_PASSWORD')
]
def releaseSigningPresent = releaseSigningValues.values().count { it != null && !it.trim().isEmpty() }
def releaseSigningReady = releaseSigningPresent == releaseSigningValues.size()
if (releaseSigningPresent > 0 && !releaseSigningReady) {
    throw new GradleException('Android release signing is partially configured. Provide ANDROID_KEYSTORE_FILE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD together.')
}

android {
    namespace = "com.goldenoremar.app"
    compileSdk {
        version = release(rootProject.ext.compileSdkVersion) {
            it.minorApiLevel = rootProject.ext.compileSdkMinorVersion
        }
    }
    defaultConfig {
        applicationId "com.goldenoremar.app"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode = 3
        versionName = "1.2.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseSigningValues.storeFilePath)
                storePassword releaseSigningValues.storePasswordValue
                keyAlias releaseSigningValues.keyAliasValue
                keyPassword releaseSigningValues.keyPasswordValue
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
